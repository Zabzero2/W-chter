<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTW Wächter Pro v17</title>

<style>
    body {
        margin: 0;
        padding: 10px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow-x: hidden;
        user-select: none;
    }

    h2 { margin: 5px 0 10px; }

    #zoomHeader {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        background: #2b2b2b;
        padding: 10px;
        border-radius: 10px;
        min-height: 60px;
    }

    /* Neu: Klickbare, interaktive Zoom-Boxen */
    .zoom-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #444;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid #555;
        cursor: pointer;
        transition: 0.2s;
    }

    .zoom-box:active { background: #555; }
    
    .zoom-box.active-zoom {
        border-color: #00aaff;
        background: #2a4054;
    }

    .zoom-canvas {
        width: 80px; 
        height: 40px;
        background: black;
        border: 1px solid #111;
        image-rendering: pixelated; 
    }

    .zoom-label {
        font-size: 11px;
        margin-top: 4px;
        font-weight: bold;
    }

    .zoom-stats {
        font-size: 11px;
        color: #ccc;
        margin-top: 2px;
        line-height: 1.3;
    }

    #ui {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .button-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    button {
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation;
    }

    button:hover { background: #0060d1; }
    #monitorBtn { background: #28a745; } 
    #monitorBtn.off { background: #dc3545; } 
    #resetBtn { background: #555; }

    .controls {
        width: 95%;
        max-width: 450px;
        background: #2b2b2b;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
    }

    .slider-row label {
        width: 160px;
        text-align: left;
        font-size: 13px;
    }

    .slider-row input, .slider-row select { 
        flex-grow: 1; 
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
    }

    .dpad-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        background: #333;
        padding: 8px;
        border-radius: 8px;
    }
    
    .dpad-row { display: flex; gap: 15px; }

    .dpad-btn {
        background: #555;
        font-size: 18px;
        padding: 10px 25px;
    }

    #container {
        position: relative;
        margin-top: 10px;
        display: inline-block;
        max-width: 100%;
    }

    canvas {
        width: 100%;
        max-width: 100%;
        height: auto;
        background: black;
        border: 2px solid #555;
        border-radius: 8px;
        touch-action: none;
    }

    video { display: none; }
</style>
</head>
<body>

<div id="zoomHeader"></div>

<div id="ui">
    <div class="button-row">
        <button id="startBtn">Kamera starten</button>
        <button id="monitorBtn">Überwachung: AN</button>
        <button id="toggleZoomTextBtn">Werte (Oben): AN</button>
        <button id="resetBtn">Reset</button>
    </div>
    
    <div class="button-row" style="margin-top: -2px;">
        <button id="toggleCameraBtn" style="background: #17a2b8;">Hauptkamera: SICHTBAR</button>
    </div>

    <div class="controls">
        <div class="slider-row">
            <label>Anzahl Boxen:</label>
            <select id="boxCountSelect">
                <option value="1">1 Box</option>
                <option value="2">2 Boxen</option>
                <option value="3">3 Boxen</option>
                <option value="4">4 Boxen</option>
            </select>
        </div>
        
        <div class="slider-row">
            <label>Empfindlichkeit: <span id="valSens">15</span></label>
            <input type="range" id="slideSens" min="2" max="100" value="15">
        </div>
        <div class="slider-row">
            <label>Box Breite: <span id="valWidth">80</span></label>
            <input type="range" id="slideWidth" min="20" max="100" value="80">
        </div>
        <div class="slider-row">
            <label>Box Höhe: <span id="valHeight">30</span></label>
            <input type="range" id="slideHeight" min="10" max="50" value="30">
        </div>
        <div class="slider-row">
            <label>Min. Pulse: <span id="valPulse">4</span></label>
            <input type="range" id="slidePulse" min="1" max="10" value="4">
        </div>
        <div class="slider-row">
            <label>Alarmdauer: <span id="valHold">1.5</span>s</label>
            <input type="range" id="slideHold" min="0.5" max="10" step="0.5" value="1.5">
        </div>

        <div class="dpad-container" id="dpadPanel">
            <div style="font-size: 13px; margin-bottom: 5px; color: #00ff88;">
                Feinjustierung Box <span id="selectedBoxId">1</span>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" id="btnUp">🔼</button>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" id="btnLeft">◀️</button>
                <button class="dpad-btn" id="btnDown">🔽</button>
                <button class="dpad-btn" id="btnRight">▶️</button>
            </div>
        </div>
    </div>
</div>

<div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const zoomHeader = document.getElementById('zoomHeader');

const startBtn = document.getElementById('startBtn');
const monitorBtn = document.getElementById('monitorBtn');
const resetBtn = document.getElementById('resetBtn');
const toggleZoomTextBtn = document.getElementById('toggleZoomTextBtn');
const toggleCameraBtn = document.getElementById('toggleCameraBtn');

const slideSens = document.getElementById('slideSens');
const slideWidth = document.getElementById('slideWidth');
const slideHeight = document.getElementById('slideHeight');
const slidePulse = document.getElementById('slidePulse');
const slideHold = document.getElementById('slideHold');
const boxCountSelect = document.getElementById('boxCountSelect');

const valSens = document.getElementById('valSens');
const valWidth = document.getElementById('valWidth');
const valHeight = document.getElementById('valHeight');
const valPulse = document.getElementById('valPulse');
const valHold = document.getElementById('valHold');
const selectedBoxIdLabel = document.getElementById('selectedBoxId');

let isRunning = false;
let isMonitoring = true; 
let showZoomValues = true;
let showCamera = true;

let draggingBox = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let audioCtx = null;
let wakeLock = null;
let lastBeep = 0;

const HISTORY_MS = 5000; 
const MIN_CROSS_TIME = 400; 
const PIXEL_STEP = 4; // Kern intakt

const DEFAULTS = { sens: 15, width: 80, height: 30, pulse: 4, hold: 1.5, count: 2 };

let boxes = [
    { id: 1, x: 60, y: 60, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null },
    { id: 2, x: 60, y: 160, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null },
    { id: 3, x: 60, y: 260, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null },
    { id: 4, x: 60, y: 360, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null }
];

let activeBoxCount = 2;
let selectedBox = boxes[0];

function createZoomDisplays() {
    zoomHeader.innerHTML = '';
    for (let i = 0; i < activeBoxCount; i++) {
        const div = document.createElement('div');
        div.className = 'zoom-box';
        
        // Klick auf Zoom-Box -> Box für D-Pad auswählen
        div.onclick = () => {
            selectedBox = boxes[i];
            updateZoomSelectionUI();
        };

        const c = document.createElement('canvas');
        c.className = 'zoom-canvas';
        c.width = 100; 
        c.height = 50;

        const label = document.createElement('div');
        label.className = 'zoom-label';
        label.innerText = 'BOX ' + (i+1);

        const stats = document.createElement('div');
        stats.className = 'zoom-stats';
        stats.style.display = showZoomValues ? 'block' : 'none';
        stats.innerHTML = `Diff: 0<br>Puls: 0`;

        div.appendChild(c);
        div.appendChild(label);
        div.appendChild(stats);
        zoomHeader.appendChild(div);

        boxes[i].zoomCtx = c.getContext('2d');
        boxes[i].zoomStatsDiv = stats;
    }
    updateZoomSelectionUI();
}

function updateZoomSelectionUI() {
    const zBoxes = document.querySelectorAll('.zoom-box');
    zBoxes.forEach((div, idx) => {
        if (boxes[idx] === selectedBox) div.classList.add('active-zoom');
        else div.classList.remove('active-zoom');
    });
    if (selectedBox) selectedBoxIdLabel.innerText = selectedBox.id;
}

function updateLabels() {
    valSens.innerText = slideSens.value; valWidth.innerText = slideWidth.value;
    valHeight.innerText = slideHeight.value; valPulse.innerText = slidePulse.value;
    valHold.innerText = slideHold.value;
}

function saveSettings() {
    const settings = {
        sens: slideSens.value, width: slideWidth.value, height: slideHeight.value, 
        pulse: slidePulse.value, hold: slideHold.value, count: activeBoxCount,
        showZoomValues: showZoomValues, showCamera: showCamera,
        positions: boxes.map(b => ({ x: b.x, y: b.y }))
    };
    localStorage.setItem('estw_settings_v17', JSON.stringify(settings));
}

function loadSettings() {
    try {
        const saved = localStorage.getItem('estw_settings_v17');
        if (saved) {
            const s = JSON.parse(saved);
            if (s.sens) slideSens.value = s.sens; if (s.width) slideWidth.value = s.width;
            if (s.height) slideHeight.value = s.height; if (s.pulse) slidePulse.value = s.pulse;
            if (s.hold) slideHold.value = s.hold;
            if (s.count) { activeBoxCount = parseInt(s.count); boxCountSelect.value = activeBoxCount; }
            if (s.showZoomValues !== undefined) { showZoomValues = s.showZoomValues; }
            if (s.showCamera !== undefined) { showCamera = s.showCamera; }
            if (s.positions) {
                s.positions.forEach((pos, idx) => { if (boxes[idx]) { boxes[idx].x = pos.x; boxes[idx].y = pos.y; } });
            }
        }
    } catch(e) {}
    
    toggleZoomTextBtn.innerText = showZoomValues ? "Werte (Oben): AN" : "Werte (Oben): AUS";
    toggleZoomTextBtn.style.background = showZoomValues ? "#007bff" : "#555";
    toggleCameraBtn.innerText = showCamera ? "Hauptkamera: SICHTBAR" : "Hauptkamera: VERSTECKT";
    toggleCameraBtn.style.background = showCamera ? "#17a2b8" : "#555";

    createZoomDisplays();
    updateLabels();
    boxes.forEach(b => { b.w = parseInt(slideWidth.value); b.h = parseInt(slideHeight.value); });
}

loadSettings();

// Event Listener für die neuen Buttons
toggleZoomTextBtn.addEventListener('click', (e) => {
    showZoomValues = !showZoomValues;
    e.target.innerText = showZoomValues ? "Werte (Oben): AN" : "Werte (Oben): AUS";
    e.target.style.background = showZoomValues ? "#007bff" : "#555";
    for (let i = 0; i < activeBoxCount; i++) {
        if (boxes[i].zoomStatsDiv) boxes[i].zoomStatsDiv.style.display = showZoomValues ? 'block' : 'none';
    }
    saveSettings();
});

toggleCameraBtn.addEventListener('click', (e) => {
    showCamera = !showCamera;
    e.target.innerText = showCamera ? "Hauptkamera: SICHTBAR" : "Hauptkamera: VERSTECKT";
    e.target.style.background = showCamera ? "#17a2b8" : "#555";
    saveSettings();
});

// Event Listener Slider etc.
slideSens.addEventListener('input', () => { updateLabels(); saveSettings(); });
slidePulse.addEventListener('input', () => { updateLabels(); saveSettings(); });
slideHold.addEventListener('input', () => { updateLabels(); saveSettings(); });

slideWidth.addEventListener('input', () => {
    updateLabels(); saveSettings();
    boxes.forEach(b => { b.w = parseInt(slideWidth.value); b.history = []; });
});

slideHeight.addEventListener('input', () => {
    updateLabels(); saveSettings();
    boxes.forEach(b => { b.h = parseInt(slideHeight.value); b.history = []; });
});

boxCountSelect.addEventListener('change', (e) => {
    activeBoxCount = parseInt(e.target.value);
    createZoomDisplays();
    if (selectedBox.id > activeBoxCount) { selectedBox = boxes[0]; updateZoomSelectionUI(); }
    updateLabels(); saveSettings();
});

resetBtn.addEventListener('click', () => {
    slideSens.value = DEFAULTS.sens; slideWidth.value = DEFAULTS.width;
    slideHeight.value = DEFAULTS.height; slidePulse.value = DEFAULTS.pulse;
    slideHold.value = DEFAULTS.hold; activeBoxCount = DEFAULTS.count;
    boxCountSelect.value = activeBoxCount;
    showZoomValues = true; showCamera = true;
    toggleZoomTextBtn.innerText = "Werte (Oben): AN"; toggleZoomTextBtn.style.background = "#007bff";
    toggleCameraBtn.innerText = "Hauptkamera: SICHTBAR"; toggleCameraBtn.style.background = "#17a2b8";
    
    createZoomDisplays(); updateLabels(); saveSettings();
    boxes.forEach((b, idx) => { 
        b.w = DEFAULTS.width; b.h = DEFAULTS.height; 
        b.x = 60; b.y = 60 + (idx * 100); b.history = []; 
    });
});

monitorBtn.addEventListener('click', () => {
    isMonitoring = !isMonitoring;
    if (isMonitoring) {
        monitorBtn.innerText = "Überwachung: AN"; monitorBtn.classList.remove("off");
    } else {
        monitorBtn.innerText = "Überwachung: AUS"; monitorBtn.classList.add("off");
        boxes.forEach(b => { b.isAlarm = false; });
    }
});

const stepSize = 1; 
document.getElementById('btnUp').onclick = () => { if(selectedBox) { selectedBox.y -= stepSize; saveSettings(); } };
document.getElementById('btnDown').onclick = () => { if(selectedBox) { selectedBox.y += stepSize; saveSettings(); } };
document.getElementById('btnLeft').onclick = () => { if(selectedBox) { selectedBox.x -= stepSize; saveSettings(); } };
document.getElementById('btnRight').onclick = () => { if(selectedBox) { selectedBox.x += stepSize; saveSettings(); } };

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function startDrag(e) {
    if (!isRunning || !showCamera) return; // Kein Drag auf schwarzem Screen
    const pos = getPointerPos(e);
    for (let i = activeBoxCount - 1; i >= 0; i--) {
        const box = boxes[i];
        if (pos.x >= box.x && pos.x <= box.x + box.w && pos.y >= box.y && pos.y <= box.y + box.h) {
            draggingBox = box; selectedBox = box; 
            updateZoomSelectionUI(); updateLabels();
            dragOffsetX = pos.x - box.x; dragOffsetY = pos.y - box.y;
            box.history = []; e.preventDefault(); break;
        }
    }
}

function moveDrag(e) {
    if (!draggingBox || !showCamera) return;
    const pos = getPointerPos(e);
    draggingBox.x = Math.max(0, Math.min(canvas.width - draggingBox.w, pos.x - dragOffsetX));
    draggingBox.y = Math.max(0, Math.min(canvas.height - draggingBox.h, pos.y - dragOffsetY));
    draggingBox.history = []; e.preventDefault();
}

function endDrag() { if(draggingBox) saveSettings(); draggingBox = null; }

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', startDrag, { passive: false });
canvas.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('touchend', endDrag);

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep() {
    const now = Date.now();
    if (now - lastBeep < 1000) return;
    lastBeep = now;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = 1000; gain.gain.value = 0.08;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

function adjustCanvas() {
    if (!video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    createZoomDisplays();
}

async function startSystem() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { adjustCanvas(); video.play(); };
        if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        isRunning = true; startBtn.innerText = 'Stoppen';
        video.onplaying = () => processFrame();
    } catch (err) { alert('Kamerafehler: ' + err.message); }
}

function stopSystem() {
    isRunning = false;
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    if (wakeLock) wakeLock.release();
    startBtn.innerText = 'Kamera starten';
}

startBtn.addEventListener('click', () => { if (!isRunning) startSystem(); else stopSystem(); });

function processFrame() {
    if (!isRunning) return;

    // Video IMMER auf Canvas zeichnen, damit die Daten berechnet werden können
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const threshold = parseInt(slideSens.value);
    const minCrossings = parseInt(slidePulse.value);
    const holdMs = parseFloat(slideHold.value) * 1000;
    let anyAlarm = false;
    const now = Date.now();

    // 1. DATEN SAMMELN UND
