<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTW Wächter Pro v15</title>

<style>
    body {
        margin: 0;
        padding: 10px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow-x: hidden;
        user-select: none; /* Verhindert Text-Markieren beim schnellen Tippen */
    }

    h2 { margin: 5px 0 10px; }

    #ui {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        touch-action: manipulation; /* Verhindert Zoom auf Tablets */
    }

    button:hover { background: #0060d1; }
    #monitorBtn { background: #28a745; } 
    #monitorBtn.off { background: #dc3545; } 
    #resetBtn { background: #555; }

    .controls {
        width: 95%;
        max-width: 450px;
        background: #2b2b2b;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
    }

    .slider-row label {
        width: 170px;
        text-align: left;
        font-size: 14px;
    }

    .slider-row input, .slider-row select { 
        flex-grow: 1; 
        padding: 5px;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
    }

    /* Steuerkreuz (D-Pad) für präzises Verschieben */
    .dpad-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        background: #333;
        padding: 10px;
        border-radius: 8px;
        margin-top: 5px;
    }
    
    .dpad-row {
        display: flex;
        gap: 10px;
    }

    .dpad-btn {
        background: #555;
        font-size: 18px;
        padding: 12px 20px;
    }
    
    .dpad-btn:active { background: #777; }

    #container {
        position: relative;
        margin-top: 12px;
        display: inline-block;
        max-width: 100%;
    }

    canvas {
        width: 100%;
        max-width: 100%;
        height: auto;
        background: black;
        border: 2px solid #555;
        border-radius: 8px;
        touch-action: none;
    }

    video { display: none; }
</style>
</head>
<body>

<h2>ESTW Wächter Pro v15</h2>

<div id="ui">
    <div class="button-row">
        <button id="startBtn">Kamera starten</button>
        <button id="monitorBtn">Überwachung: AN</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div class="controls">
        <div class="slider-row">
            <label>Anzahl Boxen:</label>
            <select id="boxCountSelect">
                <option value="1">1 Box</option>
                <option value="2">2 Boxen</option>
                <option value="3">3 Boxen</option>
                <option value="4">4 Boxen</option>
            </select>
        </div>
        
        <div class="slider-row" title="Wie hoch muss Diff mindestens sein?">
            <label>Empfindlichkeit: <span id="valSens">15</span></label>
            <input type="range" id="slideSens" min="2" max="100" value="15">
        </div>
        <div class="slider-row">
            <label>Box Breite: <span id="valWidth">120</span></label>
            <input type="range" id="slideWidth" min="30" max="300" value="120">
        </div>
        <div class="slider-row">
            <label>Box Höhe: <span id="valHeight">40</span></label>
            <input type="range" id="slideHeight" min="20" max="150" value="40">
        </div>
        <div class="slider-row" title="Wie oft muss das Licht langsam wechseln?">
            <label>Min. Pulse: <span id="valPulse">4</span></label>
            <input type="range" id="slidePulse" min="1" max="10" value="4">
        </div>
        <div class="slider-row">
            <label>Alarmdauer: <span id="valHold">1.5</span>s</label>
            <input type="range" id="slideHold" min="0.5" max="10" step="0.5" value="1.5">
        </div>

        <div class="dpad-container" id="dpadPanel">
            <div style="font-size: 14px; margin-bottom: 5px; color: #00ff88;">
                Feinjustierung für Box <span id="selectedBoxId">1</span>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" id="btnUp">🔼</button>
            </div>
            <div class="dpad-row">
                <button class="dpad-btn" id="btnLeft">◀️</button>
                <button class="dpad-btn" id="btnDown">🔽</button>
                <button class="dpad-btn" id="btnRight">▶️</button>
            </div>
        </div>
    </div>
</div>

<div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const startBtn = document.getElementById('startBtn');
const monitorBtn = document.getElementById('monitorBtn');
const resetBtn = document.getElementById('resetBtn');

const slideSens = document.getElementById('slideSens');
const slideWidth = document.getElementById('slideWidth');
const slideHeight = document.getElementById('slideHeight');
const slidePulse = document.getElementById('slidePulse');
const slideHold = document.getElementById('slideHold');
const boxCountSelect = document.getElementById('boxCountSelect');

const valSens = document.getElementById('valSens');
const valWidth = document.getElementById('valWidth');
const valHeight = document.getElementById('valHeight');
const valPulse = document.getElementById('valPulse');
const valHold = document.getElementById('valHold');
const selectedBoxIdLabel = document.getElementById('selectedBoxId');

let isRunning = false;
let isMonitoring = true; 
let draggingBox = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let audioCtx = null;
let wakeLock = null;
let lastBeep = 0;

const HISTORY_MS = 5000; 
const MIN_CROSS_TIME = 400; 
const PIXEL_STEP = 4; // Kern-Algorithmus aus v12!

const DEFAULTS = { sens: 15, width: 120, height: 40, pulse: 4, hold: 1.5, count: 2 };

// Bis zu 4 Boxen werden vorbereitet
let boxes = [
    { id: 1, x: 60, y: 60, w: 120, h: 40, history: [], isAlarm: false, lastAlarmTime: 0 },
    { id: 2, x: 60, y: 160, w: 120, h: 40, history: [], isAlarm: false, lastAlarmTime: 0 },
    { id: 3, x: 60, y: 260, w: 120, h: 40, history: [], isAlarm: false, lastAlarmTime: 0 },
    { id: 4, x: 60, y: 360, w: 120, h: 40, history: [], isAlarm: false, lastAlarmTime: 0 }
];

let activeBoxCount = 2;
let selectedBox = boxes[0]; // Box 1 ist standardmäßig ausgewählt

function updateLabels() {
    valSens.innerText = slideSens.value;
    valWidth.innerText = slideWidth.value;
    valHeight.innerText = slideHeight.value;
    valPulse.innerText = slidePulse.value;
    valHold.innerText = slideHold.value;
    if (selectedBox) selectedBoxIdLabel.innerText = selectedBox.id;
}

function saveSettings() {
    const settings = {
        sens: slideSens.value, 
        width: slideWidth.value,
        height: slideHeight.value, 
        pulse: slidePulse.value, 
        hold: slideHold.value,
        count: activeBoxCount,
        positions: boxes.map(b => ({ x: b.x, y: b.y })) // Speichert die Positionen!
    };
    localStorage.setItem('estw_settings_v15', JSON.stringify(settings));
}

function loadSettings() {
    try {
        const saved = localStorage.getItem('estw_settings_v15');
        if (saved) {
            const settings = JSON.parse(saved);
            if (settings.sens) slideSens.value = settings.sens;
            if (settings.width) slideWidth.value = settings.width;
            if (settings.height) slideHeight.value = settings.height;
            if (settings.pulse) slidePulse.value = settings.pulse;
            if (settings.hold) slideHold.value = settings.hold;
            if (settings.count) {
                activeBoxCount = parseInt(settings.count);
                boxCountSelect.value = activeBoxCount;
            }
            if (settings.positions) {
                settings.positions.forEach((pos, idx) => {
                    if (boxes[idx]) {
                        boxes[idx].x = pos.x;
                        boxes[idx].y = pos.y;
                    }
                });
            }
        }
    } catch(e) {}
    
    updateLabels();
    boxes.forEach(b => {
        b.w = parseInt(slideWidth.value);
        b.h = parseInt(slideHeight.value);
    });
}

loadSettings();

slideSens.addEventListener('input', () => { updateLabels(); saveSettings(); });
slidePulse.addEventListener('input', () => { updateLabels(); saveSettings(); });
slideHold.addEventListener('input', () => { updateLabels(); saveSettings(); });

slideWidth.addEventListener('input', () => {
    updateLabels(); saveSettings();
    boxes.forEach(b => { b.w = parseInt(slideWidth.value); b.history = []; });
});

slideHeight.addEventListener('input', () => {
    updateLabels(); saveSettings();
    boxes.forEach(b => { b.h = parseInt(slideHeight.value); b.history = []; });
});

boxCountSelect.addEventListener('change', (e) => {
    activeBoxCount = parseInt(e.target.value);
    if (selectedBox.id > activeBoxCount) {
        selectedBox = boxes[0]; // Fallback, falls die gewählte Box deaktiviert wird
    }
    updateLabels();
    saveSettings();
});

resetBtn.addEventListener('click', () => {
    slideSens.value = DEFAULTS.sens; slideWidth.value = DEFAULTS.width;
    slideHeight.value = DEFAULTS.height; slidePulse.value = DEFAULTS.pulse;
    slideHold.value = DEFAULTS.hold; activeBoxCount = DEFAULTS.count;
    boxCountSelect.value = activeBoxCount;
    
    updateLabels(); saveSettings();
    boxes.forEach((b, idx) => { 
        b.w = DEFAULTS.width; 
        b.h = DEFAULTS.height; 
        b.x = 60; 
        b.y = 60 + (idx * 100); // Standardpositionen wiederherstellen
        b.history = []; 
    });
});

monitorBtn.addEventListener('click', () => {
    isMonitoring = !isMonitoring;
    if (isMonitoring) {
        monitorBtn.innerText = "Überwachung: AN";
        monitorBtn.classList.remove("off");
    } else {
        monitorBtn.innerText = "Überwachung: AUS";
        monitorBtn.classList.add("off");
        boxes.forEach(b => { b.history = []; b.isAlarm = false; });
    }
});

// Feinjustierung (D-Pad) Buttons
const stepSize = 2; // Pixel pro Klick
document.getElementById('btnUp').onclick = () => { if(selectedBox) { selectedBox.y -= stepSize; saveSettings(); } };
document.getElementById('btnDown').onclick = () => { if(selectedBox) { selectedBox.y += stepSize; saveSettings(); } };
document.getElementById('btnLeft').onclick = () => { if(selectedBox) { selectedBox.x -= stepSize; saveSettings(); } };
document.getElementById('btnRight').onclick = () => { if(selectedBox) { selectedBox.x += stepSize; saveSettings(); } };

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function startDrag(e) {
    if (!isRunning) return;
    const pos = getPointerPos(e);
    
    // Nur durch die AKTIVEN Boxen gehen
    for (let i = activeBoxCount - 1; i >= 0; i--) {
        const box = boxes[i];
        if (pos.x >= box.x && pos.x <= box.x + box.w && pos.y >= box.y && pos.y <= box.y + box.h) {
            draggingBox = box;
            selectedBox = box; // Box als ausgewählt markieren
            updateLabels();
            
            dragOffsetX = pos.x - box.x;
            dragOffsetY = pos.y - box.y;
            box.history = [];
            e.preventDefault();
            break;
        }
    }
}

function moveDrag(e) {
    if (!draggingBox) return;
    const pos = getPointerPos(e);
    draggingBox.x = Math.max(0, Math.min(canvas.width - draggingBox.w, pos.x - dragOffsetX));
    draggingBox.y = Math.max(0, Math.min(canvas.height - draggingBox.h, pos.y - dragOffsetY));
    draggingBox.history = [];
    e.preventDefault();
}

function endDrag() { 
    if(draggingBox) saveSettings(); // Position nach dem Loslassen speichern
    draggingBox = null; 
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', startDrag, { passive: false });
canvas.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('touchend', endDrag);

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep() {
    const now = Date.now();
    if (now - lastBeep < 1000) return;
    lastBeep = now;

    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'square';
    osc.frequency.value = 1000;
    gain.gain.value = 0.08;

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
}

function adjustCanvas() {
    if (!video.videoWidth) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

async function startSystem() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => { adjustCanvas(); video.play(); };

        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        isRunning = true;
        startBtn.innerText = 'Kamera stoppen';
        video.onplaying = () => processFrame();
    } catch (err) {
        alert('Kamerafehler: ' + err.message);
    }
}

function stopSystem() {
    isRunning = false;
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    if (wakeLock) wakeLock.release();
    startBtn.innerText = 'Kamera starten';
}

startBtn.addEventListener('click', () => {
    if (!isRunning) startSystem(); else stopSystem();
});

function processFrame() {
    if (!isRunning) return;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const threshold = parseInt(slideSens.value);
    const minCrossings = parseInt(slidePulse.value);
    const holdMs = parseFloat(slideHold.value) * 1000;
    let anyAlarm = false;
    const now = Date.now();

    // Nur die AKTIV gewählte Anzahl an Boxen berechnen und zeichnen
    for (let i = 0; i < activeBoxCount; i++) {
        const box = boxes[i];
        let diff = 0;
        let crossings = 0;
        let frequency = 0;

        if (isMonitoring) {
            const rx = Math.floor(box.x);
            const ry = Math.floor(box.y);
            const rw = Math.floor(box.w);
            const rh = Math.floor(box.h);

            const frame = ctx.getImageData(rx, ry, rw, rh);
            const data = frame.data;

            let totalBrightness = 0;
            let pixelCount = 0;

            for (let j = 0; j < data.length; j += PIXEL_STEP * 4) {
                const r = data[j];
                const g = data[j + 1];
                const b = data[j + 2];
                totalBrightness += r * 0.299 + g * 0.587 + b * 0.114;
                pixelCount++;
            }

            const avgBrightness = totalBrightness / pixelCount;

            box.history.push({ val: avgBrightness, time: now });

            while (box.history.length > 0 && now - box.history[0].time > HISTORY_MS) {
                box.history.shift();
            }

            if (box.history.length > 5) {
                const values = box.history.map(v => v.val);
                const maxVal = Math.max(...values);
                const minVal = Math.min(...values);

                diff = Math.round(maxVal - minVal);
                
                const hysteresis = Math.max(diff * 0.2, threshold * 0.25);
                const mid = minVal + diff / 2;

                let state = 0;
                let lastCrossTime = 0;

                for (const item of box.history) {
                    const val = item.val;
                    const t = item.time;

                    if (val > mid + hysteresis) {
                        if (state === -1) {
                            if (t - lastCrossTime > MIN_CROSS_TIME) {
                                crossings++;
                                lastCrossTime = t;
                            }
                        }
                        state = 1;
                    } else if (val < mid - hysteresis) {
                        if (state === 1) {
                            if (t - lastCrossTime > MIN_CROSS_TIME) {
                                crossings++;
                                lastCrossTime = t;
                            }
                        }
                        state = -1;
                    }
                }

                frequency = (crossings / (HISTORY_MS / 1000)).toFixed(1);

                if (diff >= threshold && crossings >= minCrossings) {
                    box.lastAlarmTime = now;
                }
            }
        }

        if (isMonitoring && now - box.lastAlarmTime < holdMs) {
            box.isAlarm = true;
            anyAlarm = true;
        } else {
            box.isAlarm = false;
        }

        let boxColor = '#00ff00'; 
        let textColor = '#00ff88';
        if (!isMonitoring) {
            boxColor = '#888888'; 
            textColor = '#aaaaaa';
        } else if (box.isAlarm) {
            boxColor = '#ff0000'; 
            textColor = '#ff4040';
        }

        // Zeichne zusätzliche blaue Hervorhebung für die aktuell ausgewählte Box
        if (box === selectedBox) {
            ctx.beginPath();
            ctx.rect(box.x - 4, box.y - 4, box.w + 8, box.h + 8);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#00aaff'; // Cyan/Blau
            ctx.setLineDash([5, 5]); // Gestrichelte Linie
            ctx.stroke();
            ctx.setLineDash([]); // Zurücksetzen für den normalen Rahmen
        }

        ctx.beginPath();
        ctx.rect(box.x, box.y, box.w, box.h);
        ctx.lineWidth = box.isAlarm ? 4 : 2;
        ctx.strokeStyle = boxColor;
        ctx.stroke();

        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = textColor;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;

        let text = `Diff:${diff} Puls:${crossings} Hz:${frequency}`;
        if (!isMonitoring) text = "PAUSE";

        ctx.strokeText(text, box.x, box.y - 8);
        ctx.fillText(text, box.x, box.y - 8);
    }

    if (anyAlarm) {
        playBeep();
    }

    requestAnimationFrame(processFrame);
}

window.addEventListener('resize', adjustCanvas);
</script>
</body>
</html>
