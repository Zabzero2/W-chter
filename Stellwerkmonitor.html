<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTW Monitor Alarm v5 - Blink-Erkennung</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 10px; overflow-x: hidden;}
        #ui { margin-top: 5px; display: flex; flex-direction: column; align-items: center; gap: 10px;}
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;}
        button:active { background: #0056b3; }
        .controls { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; background: #333; padding: 10px; border-radius: 8px; width: 90%; max-width: 400px;}
        .slider-row { display: flex; justify-content: space-between; width: 100%; align-items: center;}
        input[type="range"] { flex-grow: 1; margin-left: 10px; }
        #container { position: relative; display: inline-block; margin-top: 10px; max-width: 100%; }
        video { display: none; } 
        canvas { background: #000; width: 100%; height: auto; touch-action: none; border: 2px solid #555; border-radius: 8px; }
    </style>
</head>
<body>

    <h2 style="margin: 5px 0;">ESTW Wächter Pro v5</h2>
    
    <div id="ui">
        <button id="startBtn">Kamera & Alarm Starten</button>
        <div class="controls">
            <div class="slider-row" title="Wie stark muss sich das Bild verändern, um Alarm auszulösen?">
                <label>Empfindlichkeit: <span id="valSens">15</span></label>
                <input type="range" id="slideSens" min="2" max="100" value="15">
            </div>
            <div class="slider-row">
                <label>Box Breite: <span id="valWidth">120</span></label>
                <input type="range" id="slideWidth" min="20" max="300" value="120">
            </div>
            <div class="slider-row">
                <label>Box Höhe: <span id="valHeight">40</span></label>
                <input type="range" id="slideHeight" min="20" max="150" value="40">
            </div>
        </div>
    </div>

    <div id="container">
        <video id="video" playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        
        const slideSens = document.getElementById('slideSens');
        const slideWidth = document.getElementById('slideWidth');
        const slideHeight = document.getElementById('slideHeight');
        
        let isRunning = false;
        let audioCtx;
        let lastBeepTime = 0;

        let boxes = [
            { id: 1, x: 50, y: 50, w: 120, h: 40, isAlarm: false, history: [] },
            { id: 2, x: 50, y: 150, w: 120, h: 40, isAlarm: false, history: [] }
        ];
        
        let draggingBox = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        slideSens.addEventListener('input', e => document.getElementById('valSens').innerText = e.target.value);
        slideWidth.addEventListener('input', e => {
            let w = parseInt(e.target.value);
            document.getElementById('valWidth').innerText = w;
            boxes.forEach(b => b.w = w);
        });
        slideHeight.addEventListener('input', e => {
            let h = parseInt(e.target.value);
            document.getElementById('valHeight').innerText = h;
            boxes.forEach(b => b.h = h);
        });

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function handleStart(e) {
            if (!isRunning) return;
            const pos = getPointerPos(e);
            for (let i = boxes.length - 1; i >= 0; i--) {
                let box = boxes[i];
                if (pos.x >= box.x && pos.x <= box.x + box.w && pos.y >= box.y && pos.y <= box.y + box.h) {
                    draggingBox = box;
                    dragOffsetX = pos.x - box.x;
                    dragOffsetY = pos.y - box.y;
                    e.preventDefault(); 
                    break;
                }
            }
        }

        function handleMove(e) {
            if (draggingBox) {
                const pos = getPointerPos(e);
                draggingBox.x = pos.x - dragOffsetX;
                draggingBox.y = pos.y - dragOffsetY;
                draggingBox.x = Math.max(0, Math.min(canvas.width - draggingBox.w, draggingBox.x));
                draggingBox.y = Math.max(0, Math.min(canvas.height - draggingBox.h, draggingBox.y));
                e.preventDefault();
            }
        }

        function handleEnd() { draggingBox = null; }

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);
        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        function playBeep() {
            const now = Date.now();
            if (now - lastBeepTime < 1000) return; 
            lastBeepTime = now;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        }

        function adjustCanvasSize() {
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        }

        startBtn.addEventListener('click', async () => {
            if (!isRunning) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                    });
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        adjustCanvasSize();
                        video.play();
                    };

                    window.addEventListener('resize', adjustCanvasSize);

                    if ('wakeLock' in navigator) {
                        navigator.wakeLock.request('screen').catch(()=>{});
                    }

                    isRunning = true;
                    startBtn.innerText = "Stoppen (Neuladen)";
                    video.onplaying = () => { processFrame(); };

                } catch (err) {
                    alert("Kamerafehler: Bitte Browser-Berechtigungen prüfen! " + err.message);
                }
            } else {
                location.reload();
            }
        });

        function processFrame() {
            if (!isRunning) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let anyAlarm = false;
            const threshold = parseInt(slideSens.value); 

            for (let i = 0; i < boxes.length; i++) {
                let box = boxes[i];
                let rx = Math.floor(box.x); let ry = Math.floor(box.y);
                let rw = Math.floor(box.w); let rh = Math.floor(box.h);

                const frame = ctx.getImageData(rx, ry, rw, rh);
                const data = frame.data;
                
                let totalBrightness = 0;

                // Berechne die Gesamthelligkeit aller Pixel im Rahmen
                for (let j = 0; j < data.length; j += 4) {
                    totalBrightness += data[j] + data[j+1] + data[j+2];
                }
                
                // Durchschnittliche Helligkeit pro Pixel
                let avgBrightness = totalBrightness / (rw * rh);
                
                // Merke die Helligkeit der letzten ~90 Bilder (ca. 3 Sekunden)
                box.history.push(avgBrightness);
                if (box.history.length > 90) {
                    box.history.shift(); 
                }

                let diff = 0;
                if (box.history.length > 30) {
                    let maxBrightness = Math.max(...box.history);
                    let minBrightness = Math.min(...box.history);
                    diff = Math.floor(maxBrightness - minBrightness);

                    // Wenn der Unterschied zwischen "hellster Moment" und "dunkelster Moment" groß genug ist
                    if (diff >= threshold) {
                        box.isAlarm = true;
                        anyAlarm = true;
                    } else {
                        box.isAlarm = false;
                    }
                }

                // Rahmen zeichnen
                ctx.beginPath();
                ctx.rect(box.x, box.y, box.w, box.h);
                ctx.lineWidth = box.isAlarm ? 4 : 2;
                ctx.strokeStyle = box.isAlarm ? "#ff0000" : "#00ff00";
                ctx.stroke();
                
                // Text zeichnen
                ctx.fillStyle = box.isAlarm ? "#ff0000" : "#00ff00";
                ctx.font = "bold 18px Arial";
                
                let text = `Box ${box.id} | Diff: ${diff}`;
                ctx.strokeText(text, box.x, box.y - 8);
                ctx.fillText(text, box.x, box.y - 8);
            }

            if (anyAlarm) {
                playBeep();
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
