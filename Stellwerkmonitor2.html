<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTW Wächter Pro v26</title>

<style>
    body {
        margin: 0;
        padding: 10px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow-x: hidden;
        user-select: none;
    }

    h2 { margin: 5px 0 10px; }

    #zoomHeader {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        background: #2b2b2b;
        padding: 10px;
        border-radius: 10px;
        min-height: 60px;
    }

    .zoom-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #444;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid #555;
        cursor: pointer;
        transition: border-color 0.1s, background 0.1s;
    }
    .zoom-box:active { background: #555; }
    
    .zoom-box.active-zoom { border-color: #00aaff; background: #2a4054; }
    .zoom-box.alarm-zoom { border-color: #ff0000 !important; background: #5a1010 !important; }

    .zoom-canvas {
        width: 80px; height: 40px; background: black;
        border: 1px solid #111; image-rendering: pixelated; 
    }
    .zoom-label { font-size: 11px; margin-top: 4px; font-weight: bold; }
    .zoom-stats { font-size: 11px; color: #ccc; margin-top: 2px; line-height: 1.3; }

    .dpad-container {
        display: flex; flex-direction: column; align-items: center; gap: 15px;
        background: #333; padding: 15px 10px; border-radius: 10px;
        margin-bottom: 10px;
    }
    
    /* NEU: Starres Raster, damit nichts mehr gequetscht wird */
    .dpad-grid {
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 15px 25px;
        justify-content: center;
        align-items: end;
    }
    
    .dpad-btn { 
        background: #555; font-size: 18px; padding: 12px 25px; 
        border-radius: 6px; border: none; color: white; cursor: pointer;
        touch-action: manipulation;
    }
    .dpad-btn:active { background: #777; }

    #ui { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    .button-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 450px;}

    button {
        padding: 12px 16px; border: none; border-radius: 8px;
        background: #555; color: white; font-size: 14px; font-weight: bold;
        cursor: pointer; touch-action: manipulation; transition: 0.2s;
    }
    button:hover { background: #666; }
    
    #monitorBtn.off { background: #dc3545; } 

    .stealth-hint {
        font-size: 12px; color: #aaa; margin-top: -2px; margin-bottom: 5px;
    }

    .toggle-btn {
        width: 100%; max-width: 450px; background: #333; border: 1px solid #555;
        margin-bottom: 5px; font-size: 13px; color: #ccc;
    }
    .toggle-btn:active { background: #444; }

    .controls {
        width: 95%; max-width: 450px; background: #2b2b2b;
        border-radius: 10px; padding: 12px; display: flex;
        flex-direction: column; gap: 10px;
    }

    .slider-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .slider-row label { width: 150px; text-align: left; font-size: 13px; }
    .slider-row input[type="range"] { flex-grow: 1; }
    .slider-row select { 
        flex-grow: 1; background: #444; color: white;
        border: 1px solid #666; border-radius: 4px; padding: 5px;
    }
    
    .adj-btn {
        width: 32px; height: 32px; padding: 0; background: #555;
        font-size: 20px; line-height: 1; display: flex; justify-content: center; align-items: center;
    }
    
    .camera-row {
        background: #3a3a3a; padding: 8px; border-radius: 6px;
        display: flex; flex-direction: column; gap: 8px; margin-bottom: 5px;
    }

    #container { position: relative; margin-top: 10px; display: inline-block; max-width: 100%; }
    canvas { width: 100%; max-width: 100%; height: auto; background: black; border: 2px solid #555; border-radius: 8px; }
    video { display: none; }
</style>
</head>
<body>

<div id="stealthOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; display: none; z-index: 9999; justify-content: center; align-items: center; font-family: Arial, sans-serif; font-size: 22vw; font-weight: bold; color: white; gap: 3vw; box-sizing: border-box;">
    <span id="hoursHTML">00</span>
    <div style="display: flex; flex-direction: column; justify-content: space-between; height: 14vw; padding: 2.2vw 0; box-sizing: border-box;">
        <div style="width: 3vw; height: 3vw; background: white; border-radius: 50%;"></div>
        <div id="exitStealthBtn" style="width: 3vw; height: 3vw; background: white; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent;"></div>
    </div>
    <span id="minsHTML">00</span>
</div>

<div style="width: 100%; max-width: 474px; margin: 0 auto;">
    
    <div id="zoomHeader"></div>

    <div class="dpad-container" id="dpadPanel">
        <div style="font-size: 13px; color: #00ff88; margin-bottom: 5px;">
            Ausgewählte Box <span id="selectedBoxId">1</span>
        </div>
        
        <div class="dpad-grid">
            
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Breite</span>
                <div style="display:flex; gap:5px;">
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnWMinus">-</button>
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnWPlus">+</button>
                </div>
            </div>
            
            <button class="dpad-btn" id="btnUp" style="padding: 15px 25px;">🔼</button>
            
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Höhe</span>
                <div style="display:flex; gap:5px;">
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnHMinus">-</button>
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnHPlus">+</button>
                </div>
            </div>

            <button class="dpad-btn" id="btnLeft" style="padding: 15px 25px;">◀️</button>
            <button class="dpad-btn" id="btnDown" style="padding: 15px 25px;">🔽</button>
            <button class="dpad-btn" id="btnRight" style="padding: 15px 25px;">▶️</button>
            
        </div>
    </div>
</div>

<div id="ui">
    <div class="button-row">
        <button id="startBtn">Kamera Start</button>
        <button id="monitorBtn">Überwachung: AKTIV</button>
        <button id="activateStealthBtn">Tarnmodus</button>
    </div>
    
    <div class="stealth-hint">Tipp: Tarnmodus beenden durch Tippen auf den unteren Uhr-Punkt.</div>

    <button id="toggleSettingsBtn" class="toggle-btn">⚙️ Einstellungen einblenden</button>

    <div class="controls" id="settingsPanel" style="display: none;">
        
        <button id="toggleDpadBtn" class="toggle-btn" style="margin-bottom: 15px; border-color: #777;">🎯 Feinjustierung ausblenden</button>

        <div class="button-row" style="margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 10px;">
            <button id="toggleZoomTextBtn">Werte: EIN</button>
            <button id="toggleCameraBtn">Live-Bild: SICHTBAR</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="camera-row">
            <div class="slider-row">
                <label>Kamera:</label>
                <select id="cameraSelect">
                    <option value="default">Standard Rückkamera</option>
                </select>
            </div>
            <div class="slider-row" id="zoomContainer">
                <label>Kamera-Zoom: <span id="valCamZoom">1.0</span>x</label>
                <button class="adj-btn" id="zoomMinus">-</button>
                <input type="range" id="slideCamZoom" min="1" max="10" step="0.1" value="1">
                <button class="adj-btn" id="zoomPlus">+</button>
            </div>
        </div>

        <div class="slider-row">
            <label>Anzahl Boxen:</label>
            <select id="boxCountSelect">
                <option value="1">1 Box</option>
                <option value="2">2 Boxen</option>
                <option value="3">3 Boxen</option>
                <option value="4">4 Boxen</option>
            </select>
        </div>
        
        <div class="slider-row">
            <label>Empfindlichkeit: <span id="valSens">15</span></label>
            <button class="adj-btn" id="sensMinus">-</button>
            <input type="range" id="slideSens" min="2" max="100" value="15">
            <button class="adj-btn" id="sensPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Rahmen-Breite: <span id="valWidth">80</span></label>
            <button class="adj-btn" id="widthMinus">-</button>
            <input type="range" id="slideWidth" min="20" max="100" value="80">
            <button class="adj-btn" id="widthPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Rahmen-Höhe: <span id="valHeight">30</span></label>
            <button class="adj-btn" id="heightMinus">-</button>
            <input type="range" id="slideHeight" min="10" max="50" value="30">
            <button class="adj-btn" id="heightPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Min. Pulse: <span id="valPulse">4</span></label>
            <button class="adj-btn" id="pulseMinus">-</button>
            <input type="range" id="slidePulse" min="1" max="10" value="4">
            <button class="adj-btn" id="pulsePlus">+</button>
        </div>
        <div class="slider-row">
            <label>Alarmdauer: <span id="valHold">1.5</span>s</label>
            <button class="adj-btn" id="holdMinus">-</button>
            <input type="range" id="slideHold" min="0.5" max="10" step="0.5" value="1.5">
            <button class="adj-btn" id="holdPlus">+</button>
        </div>
    </div>
</div>

<div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const zoomHeader = document.getElementById('zoomHeader');

const startBtn = document.getElementById('startBtn');
const monitorBtn = document.getElementById('monitorBtn');
const resetBtn = document.getElementById('resetBtn');
const toggleZoomTextBtn = document.getElementById('toggleZoomTextBtn');
const toggleCameraBtn = document.getElementById('toggleCameraBtn');
const activateStealthBtn = document.getElementById('activateStealthBtn');
const stealthOverlay = document.getElementById('stealthOverlay');
const exitStealthBtn = document.getElementById('exitStealthBtn');

const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const toggleDpadBtn = document.getElementById('toggleDpadBtn');
const dpadPanel = document.getElementById('dpadPanel');

const cameraSelect = document.getElementById('cameraSelect');
const slideCamZoom = document.getElementById('slideCamZoom');
const valCamZoom = document.getElementById('valCamZoom');

const slideSens = document.getElementById('slideSens');
const slideWidth = document.getElementById('slideWidth');
const slideHeight = document.getElementById('slideHeight');
const slidePulse = document.getElementById('slidePulse');
const slideHold = document.getElementById('slideHold');
const boxCountSelect = document.getElementById('boxCountSelect');

const valSens = document.getElementById('valSens');
const valWidth = document.getElementById('valWidth');
const valHeight = document.getElementById('valHeight');
const valPulse = document.getElementById('valPulse');
const valHold = document.getElementById('valHold');
const selectedBoxIdLabel = document.getElementById('selectedBoxId');
const hoursHTML = document.getElementById('hoursHTML');
const minsHTML = document.getElementById('minsHTML');

let isRunning = false;
let isMonitoring = true; 
let showZoomValues = true;
let showCamera = true;
let settingsVisible = false; 
let dpadVisible = true;
let currentTrack = null; 

let draggingBox = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let audioCtx = null;
let wakeLock = null;
let lastBeep = 0;

let lastFrameTime = 0;
const TARGET_FPS = 15; 
const FRAME_INTERVAL = 1000 / TARGET_FPS;
const HIT_PAD = 20; 

const HISTORY_MS = 5000; 
const MIN_CROSS_TIME = 400; 
const PIXEL_STEP = 4; 

const DEFAULTS = { sens: 15, width: 80, height: 30, pulse: 4, hold: 1.5, count: 2 };

let boxes = [
    { id: 1, x: 60, y: 60, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null },
    { id: 2, x: 60, y: 160, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null },
    { id: 3, x: 60, y: 260, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null },
    { id: 4, x: 60, y: 360, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null }
];

let activeBoxCount = 2;
let selectedBox = boxes[0];

toggleSettingsBtn.addEventListener('click', () => {
    settingsVisible = !settingsVisible;
    settingsPanel.style.display = settingsVisible ? 'flex' : 'none';
    toggleSettingsBtn.innerText = settingsVisible ? '⚙️ Einstellungen ausblenden' : '⚙️ Einstellungen einblenden';
    saveSettings();
});

toggleDpadBtn.addEventListener('click', () => {
    dpadVisible = !dpadVisible;
    dpadPanel.style.display = dpadVisible ? 'flex' : 'none';
    toggleDpadBtn.innerText = dpadVisible ? '🎯 Feinjustierung ausblenden' : '🎯 Feinjustierung einblenden';
    saveSettings();
});

function setupAdjBtn(minusId, plusId, sliderId) {
    const slider = document.getElementById(sliderId);
    document.getElementById(minusId).addEventListener('click', (e) => {
        e.preventDefault();
        let step = parseFloat(slider.step) || 1;
        slider.value = parseFloat(slider.value) - step;
        slider.dispatchEvent(new Event('input')); 
    });
    document.getElementById(plusId).addEventListener('click', (e) => {
        e.preventDefault();
        let step = parseFloat(slider.step) || 1;
        slider.value = parseFloat(slider.value) + step;
        slider.dispatchEvent(new Event('input'));
    });
}
setupAdjBtn('sensMinus', 'sensPlus', 'slideSens');
setupAdjBtn('widthMinus', 'widthPlus', 'slideWidth');
setupAdjBtn('heightMinus', 'heightPlus', 'slideHeight');
setupAdjBtn('pulseMinus', 'pulsePlus', 'slidePulse');
setupAdjBtn('holdMinus', 'holdPlus', 'slideHold');
setupAdjBtn('zoomMinus', 'zoomPlus', 'slideCamZoom');

async function loadCameras() {
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        if (videoDevices.length > 0) {
            cameraSelect.innerHTML = '';
            videoDevices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Kamera ${index + 1}`;
                cameraSelect.appendChild(option);
            });
            const saved = localStorage.getItem('estw_settings_v26');
            if (saved) {
                const s = JSON.parse(saved);
                if (s.cameraId && [...cameraSelect.options].some(opt => opt.value === s.cameraId)) {
                    cameraSelect.value = s.cameraId;
                }
            }
        }
    } catch (e) {}
}

cameraSelect.addEventListener('change', () => {
    saveSettings();
    if (isRunning) { stopSystem(); setTimeout(startSystem, 500); }
});

slideCamZoom.addEventListener('input', (e) => {
    valCamZoom.innerText = parseFloat(e.target.value).toFixed(1);
    if (currentTrack) { try { currentTrack.applyConstraints({ advanced: [{ zoom: e.target.value }] }); } catch(err) {} }
});

function createZoomDisplays() {
    zoomHeader.innerHTML = '';
    for (let i = 0; i < activeBoxCount; i++) {
        const div = document.createElement('div');
        div.className = 'zoom-box';
        div.onclick = () => { selectedBox = boxes[i]; updateZoomSelectionUI(); };

        const c = document.createElement('canvas');
        c.className = 'zoom-canvas'; c.width = 100; c.height = 50;

        const label = document.createElement('div');
        label.className = 'zoom-label'; label.innerText = 'BOX ' + (i+1);

        const stats = document.createElement('div');
        stats.className = 'zoom-stats'; stats.style.display = showZoomValues ? 'block' : 'none';
        stats.innerHTML = `Diff: 0<br>Puls: 0`;

        div.appendChild(c); div.appendChild(label); div.appendChild(stats);
        zoomHeader.appendChild(div);

        boxes[i].zoomCtx = c.getContext('2d'); 
        boxes[i].zoomStatsDiv = stats;
        boxes[i].zoomBoxDiv = div;
    }
    updateZoomSelectionUI();
}

function updateZoomSelectionUI() {
    boxes.forEach((box) => {
        if (box.zoomBoxDiv) {
            if (box === selectedBox) box.zoomBoxDiv.classList.add('active-zoom');
            else box.zoomBoxDiv.classList.remove('active-zoom');
        }
    });
    if (selectedBox) selectedBoxIdLabel.innerText = selectedBox.id;
}

function updateLabels() {
    valSens.innerText = slideSens.value; valWidth.innerText = slideWidth.value;
    valHeight.innerText = slideHeight.value; valPulse.innerText = slidePulse.value;
    valHold.innerText = slideHold.value;
}

function saveSettings() {
    const settings = {
        sens: slideSens.value, width: slideWidth.value, height: slideHeight.value, 
        pulse: slidePulse.value, hold: slideHold.value, count: activeBoxCount,
        showZoomValues: showZoomValues, showCamera: showCamera,
        settingsVisible: settingsVisible, dpadVisible: dpadVisible, cameraId: cameraSelect.value,
        positions: boxes.map(b => ({ x: b.x, y: b.y }))
    };
    localStorage.setItem('estw_settings_v26', JSON.stringify(settings));
}

function loadSettings() {
    try {
        const saved = localStorage.getItem('estw_settings_v26');
        if (saved) {
            const s = JSON.parse(saved);
            if (s.sens) slideSens.value = s.sens; if (s.width) slideWidth.value = s.width;
            if (s.height) slideHeight.value = s.height; if (s.pulse) slidePulse.value = s.pulse;
            if (s.hold) slideHold.value = s.hold;
            if (s.count) { activeBoxCount = parseInt(s.count); boxCountSelect.value = activeBoxCount; }
            if (s.showZoomValues !== undefined) showZoomValues = s.showZoomValues; 
            if (s.showCamera !== undefined) showCamera = s.showCamera; 
            if (s.settingsVisible !== undefined) {
                settingsVisible = s.settingsVisible;
                settingsPanel.style.display = settingsVisible ? 'flex' : 'none';
                toggleSettingsBtn.innerText = settingsVisible ? '⚙️ Einstellungen ausblenden' : '⚙️ Einstellungen einblenden';
            }
            if (s.dpadVisible !== undefined) {
                dpadVisible = s.dpadVisible;
                dpadPanel.style.display = dpadVisible ? 'flex' : 'none';
                toggleDpadBtn.innerText = dpadVisible ? '🎯 Feinjustierung ausblenden' : '🎯 Feinjustierung einblenden';
            }
            if (s.positions) {
                s.positions.forEach((pos, idx) => { 
                    if (boxes[idx]) { boxes[idx].x = pos.x; boxes[idx].y = pos.y; } 
                });
            }
        }
    } catch(e) {}
    
    toggleZoomTextBtn.innerText = showZoomValues ? "Werte: EIN" : "Werte: AUS";
    toggleCameraBtn.innerText = showCamera ? "Live-Bild: SICHTBAR" : "Live-Bild: VERSTECKT";

    createZoomDisplays(); updateLabels();
    
    boxes.forEach(b => { b.w = parseInt(slideWidth.value); b.h = parseInt(slideHeight.value); });
}

loadSettings();

function updateStealthClock() {
    const d = new Date();
    hoursHTML.innerText = String(d.getHours()).padStart(2, '0');
    minsHTML.innerText = String(d.getMinutes()).padStart(2, '0');
}
setInterval(updateStealthClock, 1000);

activateStealthBtn.addEventListener('click', () => { stealthOverlay.style.display = 'flex'; updateStealthClock(); });
exitStealthBtn.addEventListener('click', () => { stealthOverlay.style.display = 'none'; });

toggleZoomTextBtn.addEventListener('click', (e) => {
    showZoomValues = !showZoomValues;
    e.target.innerText = showZoomValues ? "Werte: EIN" : "Werte: AUS";
    for (let i = 0; i < activeBoxCount; i++) {
        if (boxes[i].zoomStatsDiv) boxes[i].zoomStatsDiv.style.display = showZoomValues ? 'block' : 'none';
    }
    saveSettings();
});

toggleCameraBtn.addEventListener('click', (e) => {
    showCamera = !showCamera;
    e.target.innerText = showCamera ? "Live-Bild: SICHTBAR" : "Live-Bild: VERSTECKT";
    saveSettings();
});

slideSens.addEventListener('input', () => { updateLabels(); saveSettings(); });
slidePulse.addEventListener('input', () => { updateLabels(); saveSettings(); });
slideHold.addEventListener('input', () => { updateLabels(); saveSettings(); });

slideWidth.addEventListener('input', () => { updateLabels(); saveSettings(); boxes.forEach(b => { b.w = parseInt(slideWidth.value); b.history = []; }); });
slideHeight.addEventListener('input', () => { updateLabels(); saveSettings(); boxes.forEach(b => { b.h = parseInt(slideHeight.value); b.history = []; }); });

boxCountSelect.addEventListener('change', (e) => {
    activeBoxCount = parseInt(e.target.value); createZoomDisplays();
    if (selectedBox.id > activeBoxCount) { selectedBox = boxes[0]; updateZoomSelectionUI(); }
    updateLabels(); saveSettings();
});

resetBtn.addEventListener('click', () => {
    slideSens.value = DEFAULTS.sens; slideWidth.value = DEFAULTS.width;
    slideHeight.value = DEFAULTS.height; slidePulse.value = DEFAULTS.pulse;
    slideHold.value = DEFAULTS.hold; activeBoxCount = DEFAULTS.count;
    boxCountSelect.value = activeBoxCount; showZoomValues = true; showCamera = true;
    toggleZoomTextBtn.innerText = "Werte: EIN"; toggleCameraBtn.innerText = "Live-Bild: SICHTBAR";
    createZoomDisplays(); updateLabels(); saveSettings();
    boxes.forEach((b, idx) => { b.w = DEFAULTS.width; b.h = DEFAULTS.height; b.x = 60; b.y = 60 + (idx * 100); b.history = []; });
});

monitorBtn.addEventListener('click', () => {
    isMonitoring = !isMonitoring;
    if (isMonitoring) {
        monitorBtn.innerText = "Überwachung: AKTIV"; monitorBtn.classList.remove("off");
    } else {
        monitorBtn.innerText = "Überwachung: PAUSIERT"; monitorBtn.classList.add("off");
        boxes.forEach(b => { b.isAlarm = false; });
    }
});


// --- NEUE TURBO LOGIK ---
let turboTimeout = null;
let turboInterval = null;

function startTurboAction(actionFn) {
    if (!selectedBox) return; 

    // 1. Sofort exakt einen Schritt beim Antippen ausführen
    actionFn(1);
    saveSettings();

    // 2. Halbe Sekunde (600ms) warten, bevor der Turbo überhaupt losgeht!
    turboTimeout = setTimeout(() => {
        let speed = 1;
        let tick = 0;
        
        // 3. Dauerfeuer aktivieren (läuft alle 50 Millisekunden)
        turboInterval = setInterval(() => {
            tick++;
            if (tick > 10) speed = 3;  // Nach weiteren 0.5s etwas schneller
            if (tick > 30) speed = 8;  // Nach weiteren 1.5s richtig schnell
            
            actionFn(speed);
            saveSettings();
        }, 50);
    }, 600); // <-- Das war der Puffer, der im alten Code gefehlt hat!
}

function stopTurboAction() { 
    if (turboTimeout) clearTimeout(turboTimeout); 
    if (turboInterval) clearInterval(turboInterval); 
    turboTimeout = null;
    turboInterval = null;
}

function bindTurboButton(btnId, actionFn) {
    const btn = document.getElementById(btnId);
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); startTurboAction(actionFn); });
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startTurboAction(actionFn); });
    
    // Stoppe den Turbo, sobald der Finger weggeht
    btn.addEventListener('mouseup', stopTurboAction); 
    btn.addEventListener('mouseleave', stopTurboAction);
    btn.addEventListener('touchend', stopTurboAction); 
    btn.addEventListener('touchcancel', stopTurboAction);
}

bindTurboButton('btnUp', (s) => selectedBox.y -= s);
bindTurboButton('btnDown', (s) => selectedBox.y += s);
bindTurboButton('btnLeft', (s) => selectedBox.x -= s);
bindTurboButton('btnRight', (s) => selectedBox.x += s);

bindTurboButton('btnWMinus', (s) => {
    slideWidth.value = Math.max(parseInt(slideWidth.min), parseInt(slideWidth.value) - s);
    slideWidth.dispatchEvent(new Event('input'));
});
bindTurboButton('btnWPlus', (s) => {
    slideWidth.value = Math.min(parseInt(slideWidth.max), parseInt(slideWidth.value) + s);
    slideWidth.dispatchEvent(new Event('input'));
});
bindTurboButton('btnHMinus', (s) => {
    slideHeight.value = Math.max(parseInt(slideHeight.min), parseInt(slideHeight.value) - s);
    slideHeight.dispatchEvent(new Event('input'));
});
bindTurboButton('btnHPlus', (s) => {
    slideHeight.value = Math.min(parseInt(slideHeight.max), parseInt(slideHeight.value) + s);
    slideHeight.dispatchEvent(new Event('input'));
});


function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function startDrag(e) {
    if (!isRunning || !showCamera) return; 
    const pos = getPointerPos(e);

    for (let i = activeBoxCount - 1; i >= 0; i--) {
        const box = boxes[i];
        if (pos.x >= box.x - HIT_PAD && pos.x <= box.x + box.w + HIT_PAD && 
            pos.y >= box.y - HIT_PAD && pos.y <= box.y + box.h + HIT_PAD) {
            draggingBox = box; selectedBox = box; updateZoomSelectionUI(); updateLabels();
            dragOffsetX = pos.x - box.x; dragOffsetY = pos.y - box.y; box.history = []; 
            e.preventDefault(); 
            break;
        }
    }
}

function moveDrag(e) {
    if (!draggingBox || !showCamera) return;
    const pos = getPointerPos(e);
    draggingBox.x = Math.max(0, Math.min(canvas.width - draggingBox.w, pos.x - dragOffsetX));
    draggingBox.y = Math.max(0, Math.min(canvas.height - draggingBox.h, pos.y - dragOffsetY));
    draggingBox.history = []; 
    e.preventDefault(); 
}

function endDrag() { if(draggingBox) saveSettings(); draggingBox = null; }

canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('mousemove', moveDrag); window.addEventListener('mouseup', endDrag);
canvas.addEventListener('touchstart', startDrag, { passive: false }); canvas.addEventListener('touchmove', moveDrag, { passive: false }); window.addEventListener('touchend', endDrag);

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep() {
    const now = Date.now(); if (now - lastBeep < 1000) return; lastBeep = now;
    initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.value = 1000; gain.gain.value = 0.08;
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

function adjustCanvas() {
    if (!video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight; createZoomDisplays();
}

async function startSystem() {
    try {
        let constraints = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } };
        if (cameraSelect.value && cameraSelect.value !== 'default') {
            constraints.video = { deviceId: { exact: cameraSelect.value }, width: { ideal: 1280 }, height: { ideal: 720 } };
        }
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream; currentTrack = stream.getVideoTracks()[0];

        setTimeout(() => {
            try {
                const capabilities = currentTrack.getCapabilities();
                if (capabilities.zoom) {
                    slideCamZoom.min = capabilities.zoom.min; slideCamZoom.max = capabilities.zoom.max;
                    slideCamZoom.step = capabilities.zoom.step;
                    slideCamZoom.value = currentTrack.getSettings().zoom || capabilities.zoom.min;
                    valCamZoom.innerText = parseFloat(slideCamZoom.value).toFixed(1);
                    document.getElementById('slideCamZoom').disabled = false;
                }
            } catch(e) {}
            loadCameras();
        }, 500);

        video.onloadedmetadata = () => { adjustCanvas(); video.play(); };
        if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
        
        isRunning = true; startBtn.innerText = 'Kamera Stoppen'; 
        lastFrameTime = Date.now(); requestAnimationFrame(processFrame);
    } catch (err) { alert('Kamerafehler: ' + err.message); }
}

function stopSystem() {
    isRunning = false; if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    if (wakeLock) wakeLock.release(); startBtn.innerText = 'Kamera Start';
}
startBtn.addEventListener('click', () => { if (!isRunning) startSystem(); else stopSystem(); });

function processFrame() {
    if (!isRunning) return;

    requestAnimationFrame(processFrame);
    const now = Date.now(); const elapsed = now - lastFrameTime;
    if (elapsed < FRAME_INTERVAL) return;
    lastFrameTime = now - (elapsed % FRAME_INTERVAL);

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const threshold = parseInt(slideSens.value); const minCrossings = parseInt(slidePulse.value);
    const holdMs = parseFloat(slideHold.value) * 1000; let anyAlarm = false; 

    for (let i = 0; i < activeBoxCount; i++) {
        const box = boxes[i]; let diff = 0; let crossings = 0; let frequency = 0;
        const rx = Math.floor(box.x); const ry = Math.floor(box.y); const rw = Math.floor(box.w); const rh = Math.floor(box.h);

        if (box.zoomCtx) {
            box.zoomCtx.fillStyle = "black"; box.zoomCtx.fillRect(0, 0, 100, 50);
            box.zoomCtx.drawImage(canvas, rx, ry, rw, rh, 0, 0, 100, 50);
        }

        const frame = ctx.getImageData(rx, ry, rw, rh); const data = frame.data;
        let totalBrightness = 0; let pixelCount = 0;

        for (let j = 0; j < data.length; j += PIXEL_STEP * 4) {
            totalBrightness += data[j] * 0.299 + data[j + 1] * 0.587 + data[j + 2] * 0.114; pixelCount++;
        }
        const avgBrightness = totalBrightness / pixelCount;
        box.history.push({ val: avgBrightness, time: now });
        while (box.history.length > 0 && now - box.history[0].time > HISTORY_MS) { box.history.shift(); }

        if (box.history.length > 5) {
            const values = box.history.map(v => v.val); const maxVal = Math.max(...values); const minVal = Math.min(...values);
            diff = Math.round(maxVal - minVal);
            const hysteresis = Math.max(diff * 0.2, threshold * 0.25); const mid = minVal + diff / 2;
            let state = 0; let lastCrossTime = 0;

            for (const item of box.history) {
                if (item.val > mid + hysteresis) {
                    if (state === -1 && item.time - lastCrossTime > MIN_CROSS_TIME) { crossings++; lastCrossTime = item.time; }
                    state = 1;
                } else if (item.val < mid - hysteresis) {
                    if (state === 1 && item.time - lastCrossTime > MIN_CROSS_TIME) { crossings++; lastCrossTime = item.time; }
                    state = -1;
                }
            }
            frequency = (crossings / (HISTORY_MS / 1000)).toFixed(1);
            if (isMonitoring && diff >= threshold && crossings >= minCrossings) { box.lastAlarmTime = now; }
        }

        if (isMonitoring && now - box.lastAlarmTime < holdMs) { box.isAlarm = true; anyAlarm = true; } else { box.isAlarm = false; }
        box.currentDiff = diff; box.currentCrossings = crossings; box.currentFrequency = frequency;

        if (box.zoomBoxDiv) {
            if (box.isAlarm && isMonitoring) {
                box.zoomBoxDiv.classList.add('alarm-zoom');
            } else {
                box.zoomBoxDiv.classList.remove('alarm-zoom');
            }
        }

        if (box.zoomStatsDiv && showZoomValues) {
            let txt = `Diff: ${diff}<br>Puls: ${crossings}`;
            if (!isMonitoring) txt += `<br><b style="color:#ff4444;">[PAUSE]</b>`;
            box.zoomStatsDiv.innerHTML = txt;
        }
    }

    if (!showCamera) {
        ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#333"; ctx.font = "20px Arial"; ctx.textAlign = "center";
        ctx.fillText("Kamerabild ausgeblendet", canvas.width / 2, canvas.height / 2);
        ctx.fillText("Die Analyse läuft weiter...", canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = "left"; 
    } else {
        for (let i = 0; i < activeBoxCount; i++) {
            const box = boxes[i]; 
            
            let fillColor = box.isAlarm ? 'rgba(255,0,0,0.3)' : 'rgba(0,255,0,0.15)';
            let borderColor = box.isAlarm ? '#ff0000' : '#00ff00';
            
            if (!isMonitoring) {
                fillColor = 'rgba(136,136,136,0.3)';
                borderColor = '#888888';
            }
            
            ctx.fillStyle = fillColor; ctx.fillRect(box.x, box.y, box.w, box.h);

            if (box === selectedBox) {
                ctx.beginPath(); ctx.rect(box.x - 4, box.y - 4, box.w + 8, box.h + 8);
                ctx.lineWidth = 2; ctx.strokeStyle = '#00aaff'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            
            ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); 
            ctx.lineWidth = box.isAlarm ? 4 : 2; ctx.strokeStyle = borderColor; ctx.stroke();
        }
    }

    if (anyAlarm) playBeep();
}
window.addEventListener('resize', adjustCanvas);
</script>
