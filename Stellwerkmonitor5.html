<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTW Wächter Pro v33</title>

<style>
    body {
        margin: 0;
        padding: 10px;
        background: #1e1e1e;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow-x: hidden;
        user-select: none;
    }

    #topPanelContainer {
        background: #2b2b2b;
        border-radius: 10px;
        margin-bottom: 10px;
        overflow: hidden;
        width: 100%;
    }

    #zoomHeader {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 10px;
        min-height: 60px;
    }

    .zoom-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #444;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid #555;
        cursor: pointer;
        transition: border-color 0.1s, background 0.1s;
    }
    .zoom-box:active { background: #555; }
    
    .zoom-box.active-zoom { border-color: #00aaff; background: #2a4054; }
    .zoom-box.alarm-zoom { border-color: #ff0000 !important; background: #5a1010 !important; }

    .anchor-zoom { border-color: #17a2b8; background: #0f4c5c; padding: 5px 10px; }
    .anchor-zoom.alarm-zoom { border-color: #ffaa00 !important; background: #663300 !important; }
    
    .mute-zoom { border-color: #28a745; background: #14441e; padding: 5px 10px; }

    .zoom-canvas {
        width: 80px; height: 40px; background: black;
        border: 1px solid #111; image-rendering: pixelated; 
    }
    
    .zoom-label { font-size: 11px; margin-top: 4px; font-weight: bold; }
    .zoom-stats { font-size: 11px; color: #ccc; margin-top: 2px; line-height: 1.3; }

    .dpad-container {
        display: flex; flex-direction: column; align-items: center; gap: 15px;
        background: #333; padding: 15px 10px; border-radius: 10px;
        margin-bottom: 10px;
    }
    
    .dpad-grid {
        display: grid;
        grid-template-columns: auto auto auto;
        gap: 15px 25px;
        justify-content: center;
        align-items: end;
    }
    
    .dpad-btn { 
        background: #555; font-size: 18px; padding: 12px 25px; 
        border-radius: 6px; border: none; color: white; cursor: pointer;
        touch-action: manipulation;
    }
    .dpad-btn:active { background: #777; }

    #ui { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    .button-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 450px;}

    button {
        padding: 12px 16px; border: none; border-radius: 8px;
        background: #555; color: white; font-size: 14px; font-weight: bold;
        cursor: pointer; touch-action: manipulation; transition: 0.2s;
    }
    button:hover { background: #666; }
    
    #monitorBtn.off { background: #dc3545; } 
    #anchorBtn.off { background: #555; }
    #anchorBtn { background: #17a2b8; }
    #muteBoxBtn.off { background: #555; }
    #muteBoxBtn { background: #28a745; }

    .stealth-hint {
        font-size: 12px; color: #aaa; margin-top: -2px; margin-bottom: 5px;
    }

    .toggle-btn {
        width: 100%; max-width: 450px; background: #333; border: 1px solid #555;
        margin-bottom: 5px; font-size: 13px; color: #ccc;
    }
    .toggle-btn:active { background: #444; }

    .controls {
        width: 95%; max-width: 450px; background: #2b2b2b;
        border-radius: 10px; padding: 12px; display: flex;
        flex-direction: column; gap: 10px;
    }

    .slider-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .slider-row label { width: 150px; text-align: left; font-size: 13px; }
    .slider-row input[type="range"] { flex-grow: 1; }
    .slider-row select { 
        flex-grow: 1; background: #444; color: white;
        border: 1px solid #666; border-radius: 4px; padding: 5px;
    }
    
    .adj-btn {
        width: 32px; height: 32px; padding: 0; background: #555;
        font-size: 20px; line-height: 1; display: flex; justify-content: center; align-items: center;
    }
    
    .camera-row {
        background: #3a3a3a; padding: 8px; border-radius: 6px;
        display: flex; flex-direction: column; gap: 8px; margin-bottom: 5px;
    }

    #container { position: relative; margin-top: 10px; display: inline-block; max-width: 100%; }
    canvas { width: 100%; max-width: 100%; height: auto; background: black; border: 2px solid #555; border-radius: 8px; }
    video { display: none; }
</style>
</head>
<body>

<div id="stealthOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; display: none; z-index: 9999; justify-content: center; align-items: center; font-family: Arial, sans-serif; font-size: 22vw; font-weight: bold; color: white; gap: 3vw; box-sizing: border-box;">
    <span id="hoursHTML">00</span>
    <div style="display: flex; flex-direction: column; justify-content: space-between; height: 14vw; padding: 2.2vw 0; box-sizing: border-box;">
        <div style="width: 3vw; height: 3vw; background: white; border-radius: 50%;"></div>
        <div id="exitStealthBtn" style="width: 3vw; height: 3vw; background: white; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent;"></div>
    </div>
    <span id="minsHTML">00</span>
</div>

<div style="width: 100%; max-width: 474px; margin: 0 auto;">
    <div id="topPanelContainer">
        <div id="zoomHeader"></div>
    </div>

    <div class="dpad-container" id="dpadPanel">
        <div style="font-size: 13px; color: #00ff88; margin-bottom: 5px;">
            Ausgewählte Box <span id="selectedBoxId">1</span>
        </div>
        
        <div class="dpad-grid">
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Breite</span>
                <div style="display:flex; gap:5px;">
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnWMinus">-</button>
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnWPlus">+</button>
                </div>
            </div>
            
            <button class="dpad-btn" id="btnUp" style="padding: 15px 25px;">🔼</button>
            
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Höhe</span>
                <div style="display:flex; gap:5px;">
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnHMinus">-</button>
                    <button class="dpad-btn" style="padding: 10px 15px;" id="btnHPlus">+</button>
                </div>
            </div>

            <button class="dpad-btn" id="btnLeft" style="padding: 15px 25px;">◀️</button>
            <button class="dpad-btn" id="btnDown" style="padding: 15px 25px;">🔽</button>
            <button class="dpad-btn" id="btnRight" style="padding: 15px 25px;">▶️</button>
        </div>
    </div>
</div>

<div id="ui">
    <div class="button-row">
        <button id="startBtn">Kamera Start</button>
        <button id="monitorBtn">Überwachung: AKTIV</button>
        <button id="anchorBtn" class="off">Anker: AUS</button>
        <button id="muteBoxBtn" class="off">Mutebox: AUS</button>
        <button id="activateStealthBtn">Tarnmodus</button>
    </div>
    
    <div class="stealth-hint">Tipp: Tarnmodus beenden durch Tippen auf den unteren Uhr-Punkt.</div>

    <button id="toggleSettingsBtn" class="toggle-btn">⚙️ Einstellungen einblenden</button>

    <div class="controls" id="settingsPanel" style="display: none;">
        
        <div class="button-row" style="margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 10px;">
            <button id="toggleZoomTextBtn">Werte: EIN</button>
            <button id="toggleCameraBtn">Live-Bild: SICHTBAR</button>
            <button id="toggleDpadBtn" style="background: #444; border: 1px solid #777;">🎯 Feinjustierung: EIN</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="camera-row">
            <div class="slider-row">
                <label>Kamera:</label>
                <select id="cameraSelect">
                    <option value="default">Standard Rückkamera</option>
                </select>
            </div>
            <div class="slider-row" id="zoomContainer">
                <label>Kamera-Zoom: <span id="valCamZoom">1.0</span>x</label>
                <button class="adj-btn" id="zoomMinus">-</button>
                <input type="range" id="slideCamZoom" min="1" max="10" step="0.1" value="1">
                <button class="adj-btn" id="zoomPlus">+</button>
            </div>
        </div>

        <div class="slider-row">
            <label>Anzahl Boxen:</label>
            <select id="boxCountSelect">
                <option value="1">1 Box</option>
                <option value="2">2 Boxen</option>
                <option value="3">3 Boxen</option>
                <option value="4">4 Boxen</option>
            </select>
        </div>
        
        <div class="slider-row" style="background:#202020; padding:8px; border-radius:6px;">
            <label style="color:#00aaff;">Anker-Toleranz: <span id="valAnchorSens">20</span></label>
            <button class="adj-btn" id="anchorSensMinus">-</button>
            <input type="range" id="slideAnchorSens" min="5" max="100" value="20">
            <button class="adj-btn" id="anchorSensPlus">+</button>
        </div>

        <div class="slider-row">
            <label>Empfindlichkeit: <span id="valSens">15</span></label>
            <button class="adj-btn" id="sensMinus">-</button>
            <input type="range" id="slideSens" min="2" max="100" value="15">
            <button class="adj-btn" id="sensPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Rahmen-Breite: <span id="valWidth">80</span></label>
            <button class="adj-btn" id="widthMinus">-</button>
            <input type="range" id="slideWidth" min="20" max="100" value="80">
            <button class="adj-btn" id="widthPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Rahmen-Höhe: <span id="valHeight">30</span></label>
            <button class="adj-btn" id="heightMinus">-</button>
            <input type="range" id="slideHeight" min="10" max="50" value="30">
            <button class="adj-btn" id="heightPlus">+</button>
        </div>
        <div class="slider-row">
            <label>Min. Takt-Punkte: <span id="valPulse">4</span></label>
            <button class="adj-btn" id="pulseMinus">-</button>
            <input type="range" id="slidePulse" min="1" max="10" value="4">
            <button class="adj-btn" id="pulsePlus">+</button>
        </div>
        <div class="slider-row">
            <label>Alarmdauer: <span id="valHold">1.5</span>s</label>
            <button class="adj-btn" id="holdMinus">-</button>
            <input type="range" id="slideHold" min="0.5" max="10" step="0.5" value="1.5">
            <button class="adj-btn" id="holdPlus">+</button>
        </div>
    </div>
</div>

<div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const zoomHeader = document.getElementById('zoomHeader');

const startBtn = document.getElementById('startBtn');
const monitorBtn = document.getElementById('monitorBtn');
const anchorBtn = document.getElementById('anchorBtn');
const muteBoxBtn = document.getElementById('muteBoxBtn');
const resetBtn = document.getElementById('resetBtn');
const toggleZoomTextBtn = document.getElementById('toggleZoomTextBtn');
const toggleCameraBtn = document.getElementById('toggleCameraBtn');
const activateStealthBtn = document.getElementById('activateStealthBtn');
const stealthOverlay = document.getElementById('stealthOverlay');
const exitStealthBtn = document.getElementById('exitStealthBtn');

const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const toggleDpadBtn = document.getElementById('toggleDpadBtn');
const dpadPanel = document.getElementById('dpadPanel');

const cameraSelect = document.getElementById('cameraSelect');
const slideCamZoom = document.getElementById('slideCamZoom');
const valCamZoom = document.getElementById('valCamZoom');

const slideAnchorSens = document.getElementById('slideAnchorSens');
const valAnchorSens = document.getElementById('valAnchorSens');

const slideSens = document.getElementById('slideSens');
const slideWidth = document.getElementById('slideWidth');
const slideHeight = document.getElementById('slideHeight');
const slidePulse = document.getElementById('slidePulse');
const slideHold = document.getElementById('slideHold');
const boxCountSelect = document.getElementById('boxCountSelect');

const valSens = document.getElementById('valSens');
const valWidth = document.getElementById('valWidth');
const valHeight = document.getElementById('valHeight');
const valPulse = document.getElementById('valPulse');
const valHold = document.getElementById('valHold');
const selectedBoxIdLabel = document.getElementById('selectedBoxId');
const hoursHTML = document.getElementById('hoursHTML');
const minsHTML = document.getElementById('minsHTML');

let isRunning = false;
let isMonitoring = true; 
let showZoomValues = true;
let showCamera = true;
let settingsVisible = false; 
let dpadVisible = true;
let isStealthActive = false;
let currentTrack = null; 

let draggingBox = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let audioCtx = null;
let wakeLock = null;
let lastBeep = 0;
let lastAnchorBeep = 0;
let lastQuietBeep = 0;

let lastFrameTime = 0;
const TARGET_FPS = 15; 
const FRAME_INTERVAL = 1000 / TARGET_FPS;
const HIT_PAD = 20; 

const HISTORY_MS = 5000; 
const PIXEL_STEP = 4; 

const DEFAULTS = { sens: 15, width: 80, height: 30, pulse: 4, hold: 1.5, count: 2, anchorSens: 20 };

// Neue Intervall-Struktur für Boxen (v33): history wurde durch präzise Zeitstempel-Zählung ersetzt
let boxes = [
    { id: 1, x: 60, y: 60, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null, lastState: 0, stateChangeTime: 0, validCrossings: 0, lastCrossTime: 0 },
    { id: 2, x: 60, y: 160, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null, lastState: 0, stateChangeTime: 0, validCrossings: 0, lastCrossTime: 0 },
    { id: 3, x: 60, y: 260, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null, lastState: 0, stateChangeTime: 0, validCrossings: 0, lastCrossTime: 0 },
    { id: 4, x: 60, y: 360, w: 80, h: 30, history: [], isAlarm: false, lastAlarmTime: 0, zoomCtx: null, zoomBoxDiv: null, lastState: 0, stateChangeTime: 0, validCrossings: 0, lastCrossTime: 0 }
];

let anchorBox = { 
    id: 'Anker', x: 200, y: 100, w: 50, h: 50, 
    active: false, baseline: null, alarmStart: 0, isAlarm: false, 
    zoomCtx: null, refCtx: null, zoomBoxDiv: null, zoomStatsDiv: null, refNeedsDraw: false 
};

// NEU: Mutebox Struktur
let muteBox = {
    id: 'Mute', x: 200, y: 200, w: 60, h: 40,
    active: false, history: [], isMuted: false, insideStartTime: 0, lastLeftTime: 0,
    zoomCtx: null, zoomBoxDiv: null, zoomStatsDiv: null
};

let activeBoxCount = 2;
let selectedBox = boxes[0];

toggleSettingsBtn.addEventListener('click', () => {
    settingsVisible = !settingsVisible;
    settingsPanel.style.display = settingsVisible ? 'flex' : 'none';
    toggleSettingsBtn.innerText = settingsVisible ? '⚙️ Einstellungen ausblenden' : '⚙️ Einstellungen einblenden';
    saveSettings();
});

toggleDpadBtn.addEventListener('click', () => {
    dpadVisible = !dpadVisible;
    dpadPanel.style.display = dpadVisible ? 'flex' : 'none';
    toggleDpadBtn.innerText = dpadVisible ? '🎯 Feinjustierung: AUS' : '🎯 Feinjustierung: EIN';
    saveSettings();
});

anchorBtn.addEventListener('click', () => {
    anchorBox.active = !anchorBox.active;
    anchorBox.baseline = null; 
    if (anchorBox.active) {
        anchorBtn.innerText = "Anker: AKTIV"; anchorBtn.classList.remove("off"); selectedBox = anchorBox; 
    } else {
        anchorBtn.innerText = "Anker: AUS"; anchorBtn.classList.add("off"); if(selectedBox === anchorBox) selectedBox = boxes[0];
    }
    saveSettings(); createZoomDisplays();
});

muteBoxBtn.addEventListener('click', () => {
    muteBox.active = !muteBox.active;
    muteBox.isMuted = false; muteBox.insideStartTime = 0; muteBox.lastLeftTime = 0;
    if (muteBox.active) {
        muteBoxBtn.innerText = "Mutebox: AKTIV"; muteBoxBtn.classList.remove("off"); selectedBox = muteBox;
    } else {
        muteBoxBtn.innerText = "Mutebox: AUS"; muteBoxBtn.classList.add("off"); if(selectedBox === muteBox) selectedBox = boxes[0];
    }
    saveSettings(); createZoomDisplays();
});

function createZoomDisplays() {
    zoomHeader.innerHTML = '';
    
    // ZUG BOXEN
    for (let i = 0; i < activeBoxCount; i++) {
        const div = document.createElement('div'); div.className = 'zoom-box';
        div.onclick = () => { selectedBox = boxes[i]; updateZoomSelectionUI(); };
        const c = document.createElement('canvas'); c.className = 'zoom-canvas'; c.width = 100; c.height = 50;
        const label = document.createElement('div'); label.className = 'zoom-label'; label.innerText = 'BOX ' + (i+1);
        const stats = document.createElement('div'); stats.className = 'zoom-stats'; stats.style.display = showZoomValues ? 'block' : 'none';
        stats.innerHTML = `Diff: 0<br>Punkte: 0`;
        div.appendChild(c); div.appendChild(label); div.appendChild(stats); zoomHeader.appendChild(div);
        boxes[i].zoomCtx = c.getContext('2d'); boxes[i].zoomStatsDiv = stats; boxes[i].zoomBoxDiv = div;
    }
    
    // ANKER BOX
    if (anchorBox.active) {
        const div = document.createElement('div'); div.className = 'zoom-box anchor-zoom';
        div.onclick = () => { selectedBox = anchorBox; updateZoomSelectionUI(); };
        const label = document.createElement('div'); label.className = 'zoom-label'; label.innerText = 'ANKER';
        const canvasContainer = document.createElement('div'); canvasContainer.style.cssText = "display:flex; gap:5px; margin-top:4px;";
        const liveWrap = document.createElement('div');
        const liveLabel = document.createElement('div'); liveLabel.style.cssText="font-size:9px; color:#ccc;"; liveLabel.innerText="LIVE";
        const cLive = document.createElement('canvas'); cLive.className = 'zoom-canvas'; cLive.width = 80; cLive.height = 40;
        liveWrap.appendChild(liveLabel); liveWrap.appendChild(cLive);
        const refWrap = document.createElement('div');
        const refLabel = document.createElement('div'); refLabel.style.cssText="font-size:9px; color:#00aaff;"; refLabel.innerText="REFERENZ";
        const cRef = document.createElement('canvas'); cRef.className = 'zoom-canvas'; cRef.width = 80; cRef.height = 40;
        refWrap.appendChild(refLabel); refWrap.appendChild(cRef);
        canvasContainer.appendChild(liveWrap); canvasContainer.appendChild(refWrap);
        const stats = document.createElement('div'); stats.className = 'zoom-stats'; stats.style.display = showZoomValues ? 'block' : 'none';
        stats.innerHTML = `Lade...`;
        const rst = document.createElement('button'); rst.innerText = "🔄 Neu setzen"; rst.style.cssText = "font-size:11px; padding:4px 8px; margin-top:5px; background:#17a2b8; border-radius:4px;";
        rst.onclick = (e) => { e.stopPropagation(); anchorBox.baseline = null; playBeep(); };
        div.appendChild(label); div.appendChild(canvasContainer); div.appendChild(stats); div.appendChild(rst); zoomHeader.appendChild(div);
        anchorBox.zoomCtx = cLive.getContext('2d'); anchorBox.refCtx = cRef.getContext('2d'); anchorBox.zoomStatsDiv = stats; anchorBox.zoomBoxDiv = div;
        if (anchorBox.baseline) anchorBox.refNeedsDraw = true;
    }

    // MUTE BOX
    if (muteBox.active) {
        const div = document.createElement('div'); div.className = 'zoom-box mute-zoom';
        div.onclick = () => { selectedBox = muteBox; updateZoomSelectionUI(); };
        const c = document.createElement('canvas'); c.className = 'zoom-canvas'; c.width = 100; c.height = 50;
        const label = document.createElement('div'); label.className = 'zoom-label'; label.innerText = 'MUTE-BOX';
        const stats = document.createElement('div'); stats.className = 'zoom-stats'; stats.style.display = showZoomValues ? 'block' : 'none';
        stats.innerHTML = `Inaktiv`;
        div.appendChild(c); div.appendChild(label); div.appendChild(stats); zoomHeader.appendChild(div);
        muteBox.zoomCtx = c.getContext('2d'); muteBox.zoomStatsDiv = stats; muteBox.zoomBoxDiv = div;
    }
    
    updateZoomSelectionUI();
}

function updateZoomSelectionUI() {
    let allDivs = [...boxes.map(b => b.zoomBoxDiv)];
    if (anchorBox.active) allDivs.push(anchorBox.zoomBoxDiv);
    if (muteBox.active) allDivs.push(muteBox.zoomBoxDiv);
    allDivs.forEach((div) => { if (div) div.classList.remove('active-zoom'); });
    
    if (selectedBox && selectedBox.zoomBoxDiv) {
        selectedBox.zoomBoxDiv.classList.add('active-zoom'); selectedBoxIdLabel.innerText = selectedBox.id;
    }
}

function updateLabels() {
    valSens.innerText = slideSens.value; valWidth.innerText = slideWidth.value;
    valHeight.innerText = slideHeight.value; valPulse.innerText = slidePulse.value;
    valHold.innerText = slideHold.value; valAnchorSens.innerText = slideAnchorSens.value;
}

function saveSettings() {
    const settings = {
        sens: slideSens.value, width: slideWidth.value, height: slideHeight.value, 
        pulse: slidePulse.value, hold: slideHold.value, count: activeBoxCount, anchorSens: slideAnchorSens.value,
        showZoomValues: showZoomValues, showCamera: showCamera, settingsVisible: settingsVisible, dpadVisible: dpadVisible, cameraId: cameraSelect.value,
        positions: boxes.map(b => ({ x: b.x, y: b.y })),
        anchor: { x: anchorBox.x, y: anchorBox.y, w: anchorBox.w, h: anchorBox.h, active: anchorBox.active },
        mute: { x: muteBox.x, y: muteBox.y, w: muteBox.w, h: muteBox.h, active: muteBox.active }
    };
    localStorage.setItem('estw_settings_v33', JSON.stringify(settings));
}

function loadSettings() {
    try {
        const saved = localStorage.getItem('estw_settings_v33');
        if (saved) {
            const s = JSON.parse(saved);
            if (s.sens) slideSens.value = s.sens; if (s.width) slideWidth.value = s.width;
            if (s.height) slideHeight.value = s.height; if (s.pulse) slidePulse.value = s.pulse;
            if (s.hold) slideHold.value = s.hold; if (s.anchorSens) slideAnchorSens.value = s.anchorSens;
            if (s.count) { activeBoxCount = parseInt(s.count); boxCountSelect.value = activeBoxCount; }
            if (s.showZoomValues !== undefined) showZoomValues = s.showZoomValues; 
            if (s.showCamera !== undefined) showCamera = s.showCamera; 
            if (s.settingsVisible !== undefined) {
                settingsVisible = s.settingsVisible; settingsPanel.style.display = settingsVisible ? 'flex' : 'none';
                toggleSettingsBtn.innerText = settingsVisible ? '⚙️ Einstellungen ausblenden' : '⚙️ Einstellungen einblenden';
            }
            if (s.dpadVisible !== undefined) {
                dpadVisible = s.dpadVisible; dpadPanel.style.display = dpadVisible ? 'flex' : 'none';
                toggleDpadBtn.innerText = dpadVisible ? '🎯 Feinjustierung: AUS' : '🎯 Feinjustierung: EIN';
            }
            if (s.positions) { s.positions.forEach((pos, idx) => { if (boxes[idx]) { boxes[idx].x = pos.x; boxes[idx].y = pos.y; } }); }
            if (s.anchor) {
                anchorBox.x = s.anchor.x; anchorBox.y = s.anchor.y; anchorBox.w = s.anchor.w; anchorBox.h = s.anchor.h; anchorBox.active = s.anchor.active;
                if(anchorBox.active) { anchorBtn.innerText = "Anker: AKTIV"; anchorBtn.classList.remove("off"); }
            }
            if (s.mute) {

    if (muteBox.active) {

            let mFillColor = muteBox.isMuted ? 'rgba(40,167,69,0.35)' : 'rgba(40,167,69,0.1)';
            let mBorderColor = '#28a745'; if (!isMonitoring) { mFillColor = 'rgba(136,136,136,0.3)'; mBorderColor = '#888888'; }
            ctx.fillStyle = mFillColor; ctx.fillRect(muteBox.x, muteBox.y, muteBox.w, muteBox.h);
            if (muteBox === selectedBox) { ctx.beginPath(); ctx.rect(muteBox.x - 4, muteBox.y - 4, muteBox.w + 8, muteBox.h + 8); ctx.lineWidth = 2; ctx.strokeStyle = '#00aaff'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]); }
            ctx.beginPath(); ctx.rect(muteBox.x, muteBox.y, muteBox.w, muteBox.h); ctx.lineWidth = muteBox.isMuted ? 4 : 2; ctx.strokeStyle = mBorderColor; ctx.stroke();
        }
    }

    if (anyAlarm && !muteBox.isMuted) playBeep();
}

function getPointerPos(e) { const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) }; }
window.addEventListener('resize', adjustCanvas);
</script>
