<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTW Wächter Pro v33</title>

<style>
    :root {
        --bg: #121212;
        --panel: #1e1e1e;
        --accent: #00aaff;
        --danger: #dc3545;
        --success: #00ff88;
        --warning: #ffaa00;
        --text: #e0e0e0;
    }

    body {
        margin: 0; padding: 10px; background: var(--bg); color: var(--text);
        font-family: 'Segoe UI', Arial, sans-serif; text-align: center; overflow-x: hidden; user-select: none;
    }

    /* Panels */
    .glass-panel {
        background: var(--panel); border-radius: 12px; margin-bottom: 10px;
        border: 1px solid #333; overflow: hidden; padding: 10px;
    }

    h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); border-bottom: 1px solid #333; padding-bottom: 5px;}

    /* Zoom Displays */
    #zoomHeader { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 80px; }
    .zoom-box {
        display: flex; flex-direction: column; align-items: center; background: #252525;
        padding: 5px; border-radius: 8px; border: 2px solid #444; cursor: pointer; transition: 0.2s;
    }
    .zoom-box.active-zoom { border-color: var(--accent); background: #2a4054; }
    .zoom-box.alarm-zoom { border-color: var(--danger) !important; background: #5a1010 !important; box-shadow: 0 0 10px rgba(220,53,69,0.5); }
    .mute-active-ui { border-color: var(--warning) !important; }

    .zoom-canvas { width: 80px; height: 40px; background: black; border: 1px solid #111; image-rendering: pixelated; }
    .zoom-label { font-size: 10px; margin-top: 4px; font-weight: bold; }
    .zoom-stats { font-size: 10px; color: #aaa; margin-top: 2px; font-family: monospace; }

    /* D-Pad */
    .dpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 180px; margin: 0 auto; }
    .dpad-btn { 
        background: #444; border: none; color: white; padding: 15px; border-radius: 8px; 
        font-size: 18px; cursor: pointer; touch-action: manipulation;
    }
    .dpad-btn:active { background: var(--accent); }

    /* Layout Controls */
    .control-group { display: flex; flex-direction: column; gap: 8px; text-align: left; margin-bottom: 15px; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .slider-row label { flex: 1; font-size: 12px; }
    .slider-row input[type="range"] { flex: 2; }
    .val-badge { min-width: 35px; background: #333; padding: 2px 6px; border-radius: 4px; text-align: center; font-size: 11px; font-weight: bold; color: var(--accent); }

    .btn-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    button {
        padding: 10px 14px; border: none; border-radius: 6px; background: #444; color: white;
        font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button.primary { background: var(--accent); }
    button.danger { background: var(--danger); }
    button.warning { background: var(--warning); color: black; }

    #container { position: relative; margin-top: 10px; display: inline-block; width: 100%; max-width: 1000px; }
    canvas { width: 100%; height: auto; background: black; border: 2px solid #333; border-radius: 8px; }
    video { display: none; }

    /* Stealth Overlay */
    #stealthOverlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black;
        display: none; z-index: 9999; justify-content: center; align-items: center;
        font-size: 25vw; font-weight: bold; color: #eee;
    }
    #stealthColon { transition: opacity 0.2s; }
</style>
</head>
<body>

<div id="stealthOverlay">
    <span id="stH">00</span><span id="stealthColon">:</span><span id="stM">00</span>
    <div id="exitStealthBtn" style="position:fixed; bottom:20px; right:20px; width:40px; height:40px; opacity:0.1; background:white; border-radius:50%;"></div>
</div>

<div style="max-width: 600px; margin: 0 auto;">
    
    <div class="glass-panel">
        <div id="zoomHeader"></div>
    </div>

    <div class="glass-panel">
        <div class="btn-row" style="margin-bottom:15px;">
            <button id="startBtn" class="primary">Kamera Start</button>
            <button id="monitorBtn">Wächter: AKTIV</button>
            <button id="stealthBtn" class="warning">Tarnmodus</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <h3>🎯 Position</h3>
                <div class="dpad-grid">
                    <div></div><button class="dpad-btn" id="btnUp">▲</button><div></div>
                    <button class="dpad-btn" id="btnLeft">◀</button>
                    <button class="dpad-btn" id="btnReset">R</button>
                    <button class="dpad-btn" id="btnRight">▶</button>
                    <div></div><button class="dpad-btn" id="btnDown">▼</button><div></div>
                </div>
                <div style="margin-top:10px; font-size:11px;">Box <span id="selId" style="color:var(--accent); font-weight:bold;">1</span> ausgewählt</div>
            </div>

            <div>
                <h3>⚙️ Setup</h3>
                <div class="control-group">
                    <div class="slider-row">
                        <label>Boxen:</label>
                        <select id="boxCountSelect" style="background:#444; color:white; border:none; padding:4px;">
                            <option value="1">1</option><option value="2" selected>2</option>
                            <option value="3">3</option><option value="4">4</option>
                        </select>
                    </div>
                    <div class="slider-row">
                        <label>Anker:</label>
                        <button id="anchorBtn" style="padding:4px 8px; font-size:10px;">AUS</button>
                    </div>
                    <div class="slider-row">
                        <label>Mute-Box:</label>
                        <button id="muteBoxBtn" style="padding:4px 8px; font-size:10px;">AUS</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="glass-panel">
        <h3>📶 Analyse & Frequenz</h3>
        <div class="control-group">
            <div class="slider-row">
                <label>Schwelle (Sens.):</label>
                <input type="range" id="slideSens" min="2" max="100" value="15">
                <span class="val-badge" id="valSens">15</span>
            </div>
            <div class="slider-row">
                <label>Ziel-Frequenz:</label>
                <input type="range" id="slideTargetHz" min="0.5" max="2.5" step="0.1" value="1.0">
                <span class="val-badge" id="valTargetHz">1.0 Hz</span>
            </div>
            <div class="slider-row">
                <label>Toleranz:</label>
                <input type="range" id="slideHzTol" min="5" max="50" step="5" value="25">
                <span class="val-badge" id="valHzTol">25%</span>
            </div>
            <div class="slider-row" style="opacity:0.6">
                <label>Alarm-Haltezeit:</label>
                <input type="range" id="slideHold" min="0.5" max="5" step="0.5" value="1.5">
                <span class="val-badge" id="valHold">1.5s</span>
            </div>
        </div>
    </div>
</div>

<div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
/**
 * ESTW WÄCHTER PRO V33
 * Logik: Frequenz-Analyse & Mute-Box (Touchless)
 */

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const zoomHeader = document.getElementById('zoomHeader');

// App Status
let isRunning = false;
let isMonitoring = true;
let audioCtx = null;
let lastPointerPos = { x: 0, y: 0 };
let lastFrameTime = 0;
const FPS = 15;

// Mute-Box Logik
let muteState = {
    active: false,      // User hat Mute-Box im Menü aktiviert
    isMuted: false,     // Aktueller Audio-Stopp-Status
    mouseIn: false,
    entryTime: 0,
    exitTime: 0,
    lastReminderBeep: 0,
    x: 400, y: 50, w: 100, h: 60
};

// Boxen
let boxes = [
    { id: 1, x: 50, y: 50, w: 80, h: 30, history: [], lastPeak: 0, currentHz: 0, isAlarm: false, lastAlarm: 0 },
    { id: 2, x: 50, y: 150, w: 80, h: 30, history: [], lastPeak: 0, currentHz: 0, isAlarm: false, lastAlarm: 0 },
    { id: 3, x: 50, y: 250, w: 80, h: 30, history: [], lastPeak: 0, currentHz: 0, isAlarm: false, lastAlarm: 0 },
    { id: 4, x: 50, y: 350, w: 80, h: 30, history: [], lastPeak: 0, currentHz: 0, isAlarm: false, lastAlarm: 0 }
];

let anchorBox = { active: false, x: 200, y: 200, w: 60, h: 60, baseline: null, isAlarm: false };
let activeBoxCount = 2;
let selectedBox = boxes[0];

// Init UI & Events
function updateLabels() {
    document.getElementById('valSens').innerText = document.getElementById('slideSens').value;
    document.getElementById('valTargetHz').innerText = document.getElementById('slideTargetHz').value + " Hz";
    document.getElementById('valHzTol').innerText = document.getElementById('slideHzTol').value + "%";
    document.getElementById('valHold').innerText = document.getElementById('slideHold').value + "s";
    document.getElementById('selId').innerText = selectedBox.id || 'Anker/Mute';
}

document.querySelectorAll('input[type=range]').forEach(i => i.oninput = updateLabels);

document.getElementById('boxCountSelect').onchange = (e) => {
    activeBoxCount = parseInt(e.target.value);
    createZoomDisplays();
};

document.getElementById('anchorBtn').onclick = (e) => {
    anchorBox.active = !anchorBox.active;
    e.target.innerText = anchorBox.active ? "AKTIV" : "AUS";
    e.target.style.background = anchorBox.active ? "#17a2b8" : "#444";
    if(anchorBox.active) selectedBox = anchorBox;
    createZoomDisplays();
};

document.getElementById('muteBoxBtn').onclick = (e) => {
    muteState.active = !muteState.active;
    e.target.innerText = muteState.active ? "AKTIV" : "AUS";
    e.target.style.background = muteState.active ? "#007bff" : "#444";
    if(muteState.active) selectedBox = muteState;
    createZoomDisplays();
};

// Kamera Start
document.getElementById('startBtn').onclick = async () => {
    if (isRunning) { location.reload(); return; }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 1280 } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            isRunning = true;
            document.getElementById('startBtn').innerText = "STOP";
            requestAnimationFrame(loop);
        };
    } catch (e) { alert("Kamerafehler"); }
};

// Zoom Header erstellen
function createZoomDisplays() {
    zoomHeader.innerHTML = '';
    for (let i = 0; i < activeBoxCount; i++) {
        const b = boxes[i];
        const div = document.createElement('div');
        div.className = 'zoom-box';
        div.id = `zoom-box-${i}`;
        div.onclick = () => { selectedBox = b; updateLabels(); };
        div.innerHTML = `<canvas class="zoom-canvas" id="zcv-${i}"></canvas>
                         <div class="zoom-label">BOX ${i+1}</div>
                         <div class="zoom-stats" id="zst-${i}">0.0 Hz</div>`;
        zoomHeader.appendChild(div);
        b.zCtx = document.getElementById(`zcv-${i}`).getContext('2d');
    }
}

// Sound Logik
function playBeep(freq = 1000, vol = 0.1, duration = 0.2) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    // Mute Logik Check
    if (muteState.isMuted) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// Hauptloop
function loop(time) {
    if (!isRunning) return;
    requestAnimationFrame(loop);
    
    if (time - lastFrameTime < (1000/FPS)) return;
    lastFrameTime = time;

    ctx.drawImage(video, 0, 0);

    const now = Date.now();
    const sens = parseInt(document.getElementById('slideSens').value);
    const targetHz = parseFloat(document.getElementById('slideTargetHz').value);
    const tolPercent = parseInt(document.getElementById('slideHzTol').value) / 100;
    const holdMs = parseFloat(document.getElementById('slideHold').value) * 1000;

    let alarmFound = false;

    // 1. Mute-Box Check
    if (muteState.active) {
        const inBox = (lastPointerPos.x >= muteState.x && lastPointerPos.x <= muteState.x + muteState.w &&
                       lastPointerPos.y >= muteState.y && lastPointerPos.y <= muteState.y + muteState.h);
        
        if (inBox) {
            if (!muteState.mouseIn) { muteState.entryTime = now; muteState.mouseIn = true; }
            muteState.exitTime = 0;
        } else {
            if (muteState.mouseIn) { muteState.exitTime = now; muteState.mouseIn = false; }
        }

        // 30 Sek Nachlauf
        const stillMutedByTimer = (muteState.exitTime > 0 && now - muteState.exitTime < 30000);
        muteState.isMuted = (muteState.mouseIn || stillMutedByTimer);

        // Reminder Beep (> 2 Min in Box, alle 60 Sek)
        if (muteState.mouseIn && (now - muteState.entryTime > 120000)) {
            if (now - muteState.lastReminderBeep > 60000) {
                playBeep(400, 0.05, 0.1); // Ganz leiser Beep
                muteState.lastReminderBeep = now;
            }
        }
    } else {
        muteState.isMuted = false;
    }

    // 2. Boxen Analyse
    for (let i = 0; i < activeBoxCount; i++) {
        const b = boxes[i];
        if (b.zCtx) b.zCtx.drawImage(canvas, b.x, b.y, b.w, b.h, 0, 0, 100, 50);

        // Helligkeit
        const imgData = ctx.getImageData(b.x, b.y, b.w, b.h).data;
        let brightness = 0;
        for(let j=0; j<imgData.length; j+=16) brightness += (imgData[j]+imgData[j+1]+imgData[j+2])/3;
        brightness /= (imgData.length/16);

        b.history.push({v: brightness, t: now});
        if (b.history.length > 60) b.history.shift();

        // Frequenz Ermittlung
        const vals = b.history.map(h => h.v);
        const minV = Math.min(...vals); const maxV = Math.max(...vals);
        const diff = maxV - minV;

        if (diff > sens) {
            const mid = minV + diff/2;
            const currentIsHigh = brightness > mid;
            if (currentIsHigh && !b.wasHigh) {
                // Flanke erkannt (Puls Start)
                if (b.lastPeak > 0) {
                    const period = now - b.lastPeak;
                    b.currentHz = 1000 / period;
                }
                b.lastPeak = now;
            }
            b.wasHigh = currentIsHigh;
        }

        // Filter: Stimmt die Frequenz?
        const hzMin = targetHz * (1 - tolPercent);
        const hzMax = targetHz * (1 + tolPercent);
        const hzValid = (b.currentHz >= hzMin && b.currentHz <= hzMax);

        if (isMonitoring && hzValid && diff > sens && (now - b.lastPeak < 1500)) {
            b.lastAlarm = now;
        }

        b.isAlarm = (now - b.lastAlarm < holdMs);
        if (b.isAlarm) alarmFound = true;

        // UI Update
        const statDiv = document.getElementById(`zst-${i}`);
        const boxDiv = document.getElementById(`zoom-box-${i}`);
        if(statDiv) statDiv.innerText = b.currentHz.toFixed(1) + " Hz";
        if(boxDiv) {
            boxDiv.classList.toggle('alarm-zoom', b.isAlarm);
            boxDiv.classList.toggle('mute-active-ui', muteState.isMuted);
        }
    }

    // 3. Zeichnen
    drawOverlays();

    // 4. Alarm Sound
    if (alarmFound) playBeep(1000, 0.1, 0.2);
    
    // Stealth Update
    if (document.getElementById('stealthOverlay').style.display === 'flex') {
        const d = new Date();
        document.getElementById('stH').innerText = String(d.getHours()).padStart(2,'0');
        document.getElementById('stM').innerText = String(d.getMinutes()).padStart(2,'0');
        // Doppelpunkt blinkt bei Mute
        const colon = document.getElementById('stealthColon');
        if (muteState.isMuted) {
            colon.style.opacity = (Math.floor(now/500) % 2 === 0) ? "1" : "0.1";
        } else {
            colon.style.opacity = "1";
        }
    }
}

function drawOverlays() {
    // Zeichne aktive Boxen
    for (let i = 0; i < activeBoxCount; i++) {
        const b = boxes[i];
        ctx.strokeStyle = b.isAlarm ? "#ff0000" : "#00ff00";
        ctx.lineWidth = 3;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        if (b === selectedBox) { ctx.strokeStyle = "#00aaff"; ctx.setLineDash([5,5]); ctx.strokeRect(b.x-5, b.y-5, b.w+10, b.h+10); ctx.setLineDash([]); }
    }

    // Mute Box
    if (muteState.active) {
        ctx.strokeStyle = muteState.isMuted ? "#ffaa00" : "#007bff";
        ctx.setLineDash([10, 5]);
        ctx.lineWidth = 2;
        ctx.strokeRect(muteState.x, muteState.y, muteState.w, muteState.h);
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(0,123,255,0.1)";
        ctx.fillRect(muteState.x, muteState.y, muteState.w, muteState.h);
        if (selectedBox === muteState) { ctx.strokeStyle = "white"; ctx.strokeRect(muteState.x-2, muteState.y-2, muteState.w+4, muteState.h+4); }
    }
}

// Steuerung & Maus
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
    };
}

canvas.onmousemove = (e) => { lastPointerPos = getPos(e); };
canvas.ontouchmove = (e) => { lastPointerPos = getPos(e); };

// D-Pad Logik
const move = (dx, dy) => { if(selectedBox) { selectedBox.x += dx; selectedBox.y += dy; } };
document.getElementById('btnUp').onclick = () => move(0, -2);
document.getElementById('btnDown').onclick = () => move(0, 2);
document.getElementById('btnLeft').onclick = () => move(-2, 0);
document.getElementById('btnRight').onclick = () => move(2, 0);
document.getElementById('btnReset').onclick = () => { selectedBox.x = 100; selectedBox.y = 100; };

// Monitoring Toggle
document.getElementById('monitorBtn').onclick = (e) => {
    isMonitoring = !isMonitoring;
    e.target.innerText = isMonitoring ? "Wächter: AKTIV" : "Wächter: PAUSE";
    e.target.style.background = isMonitoring ? "#444" : "#dc3545";
};

// Stealth Toggle
document.getElementById('stealthBtn').onclick = () => { document.getElementById('stealthOverlay').style.display = 'flex'; };
document.getElementById('exitStealthBtn').onclick = () => { document.getElementById('stealthOverlay').style.display = 'none'; };

// Init
createZoomDisplays();
updateLabels();

</script>
</body>
</html>
