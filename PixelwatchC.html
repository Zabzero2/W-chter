<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel-Wächter Pro v2.1 Smart</title>

<style>
    body {
        margin: 0; padding: 10px; background: #1e1e1e; color: white;
        font-family: Arial, sans-serif; text-align: center;
        overflow-x: hidden; user-select: none; padding-bottom: 50vh; 
    }

    #topPanelContainer { background: #2b2b2b; border-radius: 10px; margin-bottom: 10px; overflow: hidden; width: 100%; }
    #zoomHeader { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 10px; min-height: 60px; }

    .zoom-box {
        display: flex; flex-direction: column; align-items: center;
        background: #444; padding: 5px; border-radius: 6px;
        border: 2px solid #555; cursor: pointer; width: 110px; 
        flex-shrink: 0; transition: border-color 0.1s, background 0.1s;
    }
    .zoom-box.active-zoom { border-color: #00aaff; background: #2a4054; }
    
    .zoom-canvas { width: 80px; height: 40px; background: black; border: 1px solid #111; image-rendering: pixelated; }
    .zoom-label { font-size: 11px; margin-top: 4px; font-weight: bold; }
    .zoom-stats { font-size: 11px; color: #ccc; margin-top: 2px; line-height: 1.3; width: 100%; word-wrap: break-word; }

    .dpad-container {
        display: flex; flex-direction: column; align-items: center; gap: 15px;
        background: #333; padding: 15px 10px; border-radius: 10px; margin-bottom: 10px;
    }
    .dpad-grid { display: grid; grid-template-columns: auto auto auto; gap: 15px 25px; justify-content: center; align-items: end; }
    .dpad-btn { 
        background: #555; font-size: 18px; padding: 12px 25px; 
        border-radius: 6px; border: none; color: white; cursor: pointer; touch-action: manipulation;
    }
    .dpad-btn:active { background: #777; }

    #ui { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .button-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px;}

    button {
        padding: 12px 16px; border: none; border-radius: 8px;
        background: #555; color: white; font-size: 14px; font-weight: bold;
        cursor: pointer; touch-action: manipulation; transition: 0.2s;
    }
    button:hover { background: #666; }
    #monitorBtn.off { background: #dc3545; color: white; } 

    #mainSettingsWrapper { display: none; width: 100%; flex-direction: column; align-items: center; }

    .module-section {
        width: 95%; max-width: 900px; background: #2b2b2b; border-radius: 8px; 
        padding: 10px; margin-bottom: 5px; text-align: left; border-left: 4px solid #555;
    }
    .module-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; }
    
    .config-btn { background: #444; padding: 6px 10px; font-size: 14px; border-radius: 6px; }
    .module-body { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; }

    /* Farben der Module */
    .sec-main { border-left-color: #00ff88; }
    .sec-anchor { border-left-color: #17a2b8; }
    .sec-mute { border-left-color: #ffcc00; }
    .sec-telegram { border-left-color: #0088cc; }
    .sec-audio { border-left-color: #e83e8c; }
    .sec-weather { border-left-color: #fd7e14; }

    .slider-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .slider-row label { width: 140px; text-align: left; font-size: 13px; flex-shrink: 0; }
    .slider-row input[type="range"], .slider-row input[type="text"], .slider-row select { flex-grow: 1; background: #444; color: white; border: 1px solid #666; border-radius: 4px; padding: 5px; }
    .adj-btn { width: 32px; height: 32px; padding: 0; background: #555; font-size: 20px; display: flex; justify-content: center; align-items: center; }

    .checkbox-group { display: flex; gap: 15px; font-size: 13px; font-weight: normal; }
    
    #container { position: relative; margin-top: 10px; display: flex; justify-content: center; width: 100%; }
    canvas { width: 100%; max-width: 100%; height: auto; background: black; border: 2px solid #555; border-radius: 8px; }
    video { display: none; }

    /* V2.1: Roter Screen für MIC Alarm */
    #micAlarmOverlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(255, 0, 0, 0.85); display: none; z-index: 10000;
        justify-content: center; align-items: center; font-size: 15vw;
        font-weight: bold; color: white;
        animation: flash 0.4s infinite alternate;
    }
    @keyframes flash { from { opacity: 1; } to { opacity: 0.3; } }

</style>
</head>
<body>

<div id="stealthOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; display: none; z-index: 9999; justify-content: center; align-items: center; font-family: Arial, sans-serif; font-size: 22vw; font-weight: bold; color: white; gap: 3vw; box-sizing: border-box; transition: color 0.5s;">
    <span id="hoursHTML">00</span>
    <div style="display: flex; flex-direction: column; justify-content: space-between; height: 14vw; padding: 2.2vw 0; box-sizing: border-box;">
        <div style="width: 3vw; height: 3vw; background: currentColor; border-radius: 50%;"></div>
        <div id="exitStealthBtn" style="width: 3vw; height: 3vw; background: currentColor; border-radius: 50%; cursor: pointer;"></div>
    </div>
    <span id="minsHTML">00</span>
    
    <div id="stealthWeather" style="position: absolute; bottom: 8vh; width: 100%; display: flex; justify-content: space-evenly; font-size: 6vw; color: #777;"></div>
</div>

<div id="micAlarmOverlay">MIC ALARM</div>

<div style="width: 100%; max-width: 1000px; margin: 0 auto;">
    <div id="topPanelContainer"><div id="zoomHeader"></div></div>
    
    <div class="dpad-container" id="dpadPanel">
        <div style="font-size: 13px; color: #00ff88; margin-bottom: 5px;">Ausgewählte Box <span id="selectedBoxId">1</span></div>
        <div class="dpad-grid">
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Breite</span>
                <div style="display:flex; gap:5px;"><button class="dpad-btn" id="btnWMinus">-</button><button class="dpad-btn" id="btnWPlus">+</button></div>
            </div>
            <button class="dpad-btn" id="btnUp">🔼</button>
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <span style="font-size: 11px; color:#aaa;">Rahmen-Höhe</span>
                <div style="display:flex; gap:5px;"><button class="dpad-btn" id="btnHMinus">-</button><button class="dpad-btn" id="btnHPlus">+</button></div>
            </div>
            <button class="dpad-btn" id="btnLeft">◀️</button>
            <button class="dpad-btn" id="btnDown">🔽</button>
            <button class="dpad-btn" id="btnRight">▶️</button>
        </div>
    </div>
</div>

<div id="ui">
    <div class="button-row">
        <button id="startBtn">Kamera Start</button>
        <button id="monitorBtn" class="off">Kamera starten zur Überwachung</button>
        <button id="activateStealthBtn">Tarnmodus</button>
        <button id="toggleSettingsBtn" style="background: #444;">⚙️ Settings</button>
    </div>

    <div id="mainSettingsWrapper">
        <div class="module-section">
            <div class="module-header">
                <span>Anzeige & Justierung</span>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="chkShowZoom" checked> Werte</label>
                    <label><input type="checkbox" id="chkShowCam" checked> Live-Bild</label>
                    <label><input type="checkbox" id="chkShowDpad" checked> D-Pad</label>
                </div>
            </div>
        </div>

        <div class="module-section sec-main">
            <div class="module-header"><span>Mess-Felder (Rhythmus)</span><button class="config-btn" id="btnToggleMainConfig">⚙️</button></div>
            <div class="module-body" id="panelMainSettings" style="display: none;">
                <div class="slider-row"><label>Anzahl Felder:</label><select id="boxCountSelect"><option value="1">1 Feld</option><option value="2" selected>2 Felder</option></select></div>
                <div class="slider-row"><label>Sensibilität: <span id="valSens">30</span></label><input type="range" id="slideSens" min="2" max="100" value="30"></div>
                <div class="slider-row"><label>Max-Delta: <span id="valMass">60</span></label><input type="range" id="slideMass" min="1" max="700" value="60"></div>
                <div class="slider-row"><label>Min. Takte: <span id="valPulse">3</span></label><input type="range" id="slidePulse" min="1" max="10" value="3"></div>
            </div>
        </div>

        <div class="module-section sec-anchor">
            <div class="module-header"><span>Anker-Referenz <label><input type="checkbox" id="chkAnchorActive"> Aktiv</label></span><button class="config-btn" id="btnToggleAnchorConfig">⚙️</button></div>
            <div class="module-body" id="panelAnchorSettings" style="display: none;">
                <div class="slider-row"><label>Toleranz-Limit: <span id="valAnchorSens">20</span></label><input type="range" id="slideAnchorSens" min="1" max="100" value="20"></div>
            </div>
        </div>

        <div class="module-section sec-telegram">
            <div class="module-header"><span>Telegram Bot Integration</span><button class="config-btn" id="btnToggleTgConfig">⚙️</button></div>
            <div class="module-body" id="panelTgSettings" style="display: none;">
                <div class="slider-row"><label>Bot Token:</label><input type="text" id="inpTgToken" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"></div>
                <div class="slider-row"><label>Chat ID:</label><input type="text" id="inpTgChatId" placeholder="123456789"></div>
                <div class="slider-row"><label>Alarm-Video:</label>
                    <select id="selTgVideoMode">
                        <option value="full">HD-Vollbild</option>
                        <option value="box">Nur Alarm-Box (Datenspar-Modus)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="module-section sec-audio">
            <div class="module-header"><span>Audio-Wächter (Mikrofon) <label><input type="checkbox" id="chkAudioActive"> Aktiv</label></span><button class="config-btn" id="btnToggleAudioConfig">⚙️</button></div>
            <div class="module-body" id="panelAudioSettings" style="display: none;">
                <div class="slider-row">
                    <label>Audio-Schwelle: <span id="valAudioThr">50</span></label>
                    <input type="range" id="slideAudioThr" min="1" max="100" value="50">
                </div>
                <div style="font-size: 13px; text-align: left; margin-top: 5px;">
                    Live-Pegel: <progress id="progAudioLive" max="100" value="0" style="width: 100%; height: 15px;"></progress>
                </div>
            </div>
        </div>

        <div class="module-section sec-weather">
            <div class="module-header"><span>Wetter-Station (Tarnmodus)</span><button class="config-btn" id="btnToggleWeatherConfig">⚙️</button></div>
            <div class="module-body" id="panelWeatherSettings" style="display: none;">
                <p style="font-size:11px; margin-top:0; color:#aaa;">Leer lassen zum Deaktivieren. Aktualisiert alle 30 Min.</p>
                <div class="slider-row"><label>Ort 1:</label><input type="text" id="inpCity1" placeholder="Berlin"></div>
                <div class="slider-row"><label>Ort 2:</label><input type="text" id="inpCity2" placeholder="Hamburg"></div>
                <div class="slider-row"><label>Ort 3:</label><input type="text" id="inpCity3" placeholder="München"></div>
            </div>
        </div>

    </div>

    <div id="container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    // --- V1.0 Basis Variablen ---
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let isRunning = false;
    let isMonitoring = false;
    let showCamera = true;
    let lastFrameTime = 0;
    const FRAME_INTERVAL = 1000 / 15; // 15 FPS
    
    let audioCtx = null;
    
    // Core Box Objekte (vereinfachte Logik für das Snippet)
    let boxes = [
        { id: 1, x: 50, y: 50, w: 35, h: 20, active: true, validCrossings: 0, history: [] },
        { id: 2, x: 150, y: 50, w: 35, h: 20, active: true, validCrossings: 0, history: [] }
    ];
    let anchorBox = { id: 'ANKER', x: 100, y: 150, w: 40, h: 40, active: false, baseline: null };
    let selectedBox = boxes[0];

    // --- V2.1 Smart Features Variablen ---
    let tgToken = "";
    let tgChatId = "";
    let tgVideoMode = "full";
    let tgOffset = 0;
    
    let audioMicStream = null;
    let audioAnalyser = null;
    let audioDataArray = null;
    let isRecordingAudio = false;
    let isRecordingVideo = false;
    let activeRecBox = null;
    let weatherCities = ["", "", ""];

    // --- V1.0 AUDIO ENGINE (Strenge Philosophie) ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playWarningBeep() { // V1.0 Anker Sound
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = 800;
        gain.gain.value = 0.05;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
    
    function playLoudAlarm() { // V1.0 Box Sound
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.3);
        gain.gain.value = 1.0;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    }

    // --- V2.1 TELEGRAM ENGINE ---
    async function sendTgMedia(endpoint, fieldName, blob, filename) {
        if (!tgToken || !tgChatId) return;
        let formData = new FormData();
        formData.append('chat_id', tgChatId);
        formData.append(fieldName, blob, filename);
        try {
            await fetch(`https://api.telegram.org/bot${tgToken}/${endpoint}`, { method: 'POST', body: formData });
        } catch(e) { console.error("Telegram Sende-Fehler:", e); }
    }

    // Telegram Bot Befehle (/foto, /video, /audio) empfangen
    async function pollTelegramCommands() {
        if (!tgToken || !tgChatId) return;
        try {
            let res = await fetch(`https://api.telegram.org/bot${tgToken}/getUpdates?offset=${tgOffset}&timeout=5`);
            let data = await res.json();
            if (data.ok && data.result.length > 0) {
                for (let r of data.result) {
                    tgOffset = r.update_id + 1;
                    let text = r.message?.text;
                    let cid = r.message?.chat?.id;
                    if (text && cid == tgChatId) {
                        if (text === '/foto') {
                            canvas.toBlob(blob => sendTgMedia('sendPhoto', 'photo', blob, 'live.jpg'), 'image/jpeg', 0.8);
                        }
                        if (text === '/video') {
                            recordAndSendVideo('full', 5); // Manuelles Video erzwingen (ohne Alarmton)
                        }
                        if (text === '/audio') {
                            triggerAudioAlarm(); // Audio Wächter triggern
                        }
                    }
                }
            }
        } catch(e) {}
    }
    setInterval(pollTelegramCommands, 5000);

    // --- V2.1 MEDIEN AUFZEICHNUNG ---
    function recordAndSendVideo(mode, durationSec, boxObj = null) {
        if (!tgToken || !tgChatId || isRecordingVideo) return;
        isRecordingVideo = true;
        let stream;
        
        // V2.1 Datensparmodus Logik
        if (mode === 'box' && boxObj) {
            let recCanvas = document.createElement('canvas');
            recCanvas.width = boxObj.w; recCanvas.height = boxObj.h;
            stream = recCanvas.captureStream(15);
            activeRecBox = { canvas: recCanvas, ctx: recCanvas.getContext('2d'), srcBox: boxObj };
        } else {
            stream = canvas.captureStream(15);
            activeRecBox = null;
        }

        let recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        let chunks = [];
        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
            let blob = new Blob(chunks, { type: 'video/webm' });
            sendTgMedia('sendVideo', 'video', blob, 'alarm.webm');
            isRecordingVideo = false; activeRecBox = null;
        };
        recorder.start();
        setTimeout(() => recorder.stop(), durationSec * 1000);
    }

    function triggerAnkerAlarmFoto() {
        playWarningBeep(); // Strikte V1.0 Ton-Philosophie
        if (!tgToken || !tgChatId || !anchorBox.baseline) return;
        
        // Komposit Foto: Links Referenz, Rechts Live
        let compCanvas = document.createElement('canvas');
        compCanvas.width = anchorBox.w * 2; compCanvas.height = anchorBox.h;
        let cCtx = compCanvas.getContext('2d');
        
        let drawData = new Uint8ClampedArray(anchorBox.baseline);
        let imgData = new ImageData(drawData, anchorBox.w, anchorBox.h);
        let tmpC = document.createElement('canvas');
        tmpC.width = anchorBox.w; tmpC.height = anchorBox.h;
        tmpC.getContext('2d').putImageData(imgData, 0, 0);
        
        cCtx.drawImage(tmpC, 0, 0);
        cCtx.drawImage(canvas, anchorBox.x, anchorBox.y, anchorBox.w, anchorBox.h, anchorBox.w, 0, anchorBox.w, anchorBox.h);
        
        compCanvas.toBlob(blob => sendTgMedia('sendPhoto', 'photo', blob, 'anker.jpg'), 'image/jpeg', 0.8);
    }

    function triggerAudioAlarm() {
        if (isRecordingAudio || !audioMicStream) return;
        isRecordingAudio = true;
        
        // V2.1: KEIN lokaler Sound. Optisch Rot!
        document.getElementById('micAlarmOverlay').style.display = 'flex';
        
        let recorder = new MediaRecorder(audioMicStream);
        let chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            let blob = new Blob(chunks, { type: 'audio/webm' });
            sendTgMedia('sendVoice', 'voice', blob, 'mic.webm');
            isRecordingAudio = false;
            document.getElementById('micAlarmOverlay').style.display = 'none';
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 5000);
    }

    async function toggleAudioWächter() {
        if (document.getElementById('chkAudioActive').checked) {
            try {
                audioMicStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const micCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = micCtx.createMediaStreamSource(audioMicStream);
                audioAnalyser = micCtx.createAnalyser();
                audioAnalyser.fftSize = 256;
                source.connect(audioAnalyser);
                audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
            } catch(e) {
                alert("Mikrofon-Zugriff verweigert!");
                document.getElementById('chkAudioActive').checked = false;
            }
        } else {
            if (audioMicStream) {
                audioMicStream.getTracks().forEach(t => t.stop());
                audioMicStream = null; audioAnalyser = null;
            }
        }
        saveSettings();
    }

    // --- V2.1 WETTER STATION ---
    function getWmoEmoji(code) {
        if ([0].includes(code)) return '☀️';
        if ([1,2,3].includes(code)) return '⛅';
        if ([45,48].includes(code)) return '🌫️';
        if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
        if ([71,73,75,77,85,86].includes(code)) return '❄️';
        if ([95,96,99].includes(code)) return '⛈️';
        return '☁️';
    }

    async function updateWeather() {
        let container = document.getElementById('stealthWeather');
        container.innerHTML = ''; // Clear old
        for (let city of weatherCities) {
            if (!city.trim()) continue;
            try {
                let geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                let geo = await geoRes.json();
                if (geo.results && geo.results[0]) {
                    let wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.results[0].latitude}&longitude=${geo.results[0].longitude}&current_weather=true`);
                    let wData = await wRes.json();
                    let temp = Math.round(wData.current_weather.temperature);
                    let emoji = getWmoEmoji(wData.current_weather.weathercode);
                    
                    let div = document.createElement('div');
                    div.innerText = `${emoji} ${temp}°C`; // Streng nach Vorgabe: Keine Textbeschreibung
                    container.appendChild(div);
                }
            } catch(e) {}
        }
    }
    setInterval(updateWeather, 1800000); // Alle 30 Min

    // --- V1.0 CORE LOOP (mit V2.1 Hooks) ---
    function processFrame() {
        if (!isRunning) return;
        requestAnimationFrame(processFrame);
        const now = Date.now(); 
        const elapsed = now - lastFrameTime;
        if (elapsed < FRAME_INTERVAL) return; 
        lastFrameTime = now - (elapsed % FRAME_INTERVAL);

        if (showCamera) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        else { ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

        // V2.1 Video Recording Sub-Frames (Datenspar-Modus)
        if (isRecordingVideo && activeRecBox) {
            activeRecBox.ctx.drawImage(canvas, activeRecBox.srcBox.x, activeRecBox.srcBox.y, activeRecBox.srcBox.w, activeRecBox.srcBox.h, 0, 0, activeRecBox.srcBox.w, activeRecBox.srcBox.h);
        }

        // V2.1 Audio Analyse Loop
        if (audioAnalyser && isMonitoring) {
            audioAnalyser.getByteFrequencyData(audioDataArray);
            let sum = 0;
            for(let i=0; i<audioDataArray.length; i++) sum += audioDataArray[i];
            let vol = Math.min(100, Math.round(((sum / audioDataArray.length) / 255) * 100 * 2.5));
            document.getElementById('progAudioLive').value = vol;
            
            if (vol >= parseInt(document.getElementById('slideAudioThr').value) && !isRecordingAudio) {
                triggerAudioAlarm();
            }
        }

        if (!isMonitoring) return;

        // V1.0 Mock für Boxen-Logik
        boxes.forEach(box => {
            // ... (Hier läuft deine V1.0 Helligkeits/Masse Auswertung)
            let limitReached = false; // Mock
            
            if (limitReached) {
                playLoudAlarm(); // V1.0 Ton
                // V2.1 Video Trigger
                recordAndSendVideo(tgVideoMode, 5, box); 
            }
            
            // Box zeichnen
            ctx.strokeStyle = box === selectedBox ? '#00aaff' : 'red';
            ctx.strokeRect(box.x, box.y, box.w, box.h);
        });

        // V1.0 Mock für Anker
        if (anchorBox.active) {
            let anchorVerrutscht = false; // Mock (dein Struktur-Diff)
            if (anchorVerrutscht) {
                triggerAnkerAlarmFoto();
                anchorBox.baseline = null; // Reset
            }
            ctx.strokeStyle = '#17a2b8'; ctx.strokeRect(anchorBox.x, anchorBox.y, anchorBox.w, anchorBox.h);
        }
    }

    // --- SETUP & UI EVENTS ---
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true; processFrame();
            };
        } catch(e) { alert("Kamera-Fehler: " + e); }
    }

    document.getElementById('startBtn').onclick = () => { initAudio(); startCamera(); document.getElementById('mainSettingsWrapper').style.display='flex'; };
    document.getElementById('monitorBtn').onclick = () => {
        isMonitoring = !isMonitoring;
        document.getElementById('monitorBtn').innerText = isMonitoring ? 'ÜBERWACHUNG LÄUFT' : 'Kamera starten zur Überwachung';
        document.getElementById('monitorBtn').className = isMonitoring ? '' : 'off';
    };

    // Tarnmodus Logik
    document.getElementById('activateStealthBtn').onclick = () => { document.getElementById('stealthOverlay').style.display = 'flex'; };
    document.getElementById('exitStealthBtn').onclick = () => { document.getElementById('stealthOverlay').style.display = 'none'; };

    setInterval(() => {
        let d = new Date();
        document.getElementById('hoursHTML').innerText = String(d.getHours()).padStart(2, '0');
        document.getElementById('minsHTML').innerText = String(d.getMinutes()).padStart(2, '0');
    }, 1000);

    // Settings Logik
    function togglePanel(btn, panel) {
        let open = panel.style.display !== 'none';
        panel.style.display = open ? 'none' : 'flex';
        btn.classList.toggle('open', !open);
    }
    document.getElementById('btnToggleTgConfig').onclick = (e) => togglePanel(e.target, document.getElementById('panelTgSettings'));
    document.getElementById('btnToggleAudioConfig').onclick = (e) => togglePanel(e.target, document.getElementById('panelAudioSettings'));
    document.getElementById('btnToggleWeatherConfig').onclick = (e) => togglePanel(e.target, document.getElementById('panelWeatherSettings'));
    document.getElementById('toggleSettingsBtn').onclick = () => {
        let w = document.getElementById('mainSettingsWrapper');
        w.style.display = w.style.display === 'none' ? 'flex' : 'none';
    };

    // V2.1 Input Bindings
    document.getElementById('inpTgToken').onchange = (e) => { tgToken = e.target.value; saveSettings(); };
    document.getElementById('inpTgChatId').onchange = (e) => { tgChatId = e.target.value; saveSettings(); };
    document.getElementById('selTgVideoMode').onchange = (e) => { tgVideoMode = e.target.value; saveSettings(); };
    
    document.getElementById('chkAudioActive').onchange = toggleAudioWächter;
    document.getElementById('slideAudioThr').oninput = (e) => { document.getElementById('valAudioThr').innerText = e.target.value; saveSettings(); };
    
    ['inpCity1', 'inpCity2', 'inpCity3'].forEach((id, i) => {
        document.getElementById(id).onchange = (e) => { weatherCities[i] = e.target.value; saveSettings(); updateWeather(); };
    });

    function saveSettings() {
        let s = {
            tgToken: tgToken, tgChatId: tgChatId, tgVideoMode: tgVideoMode,
            audioActive: document.getElementById('chkAudioActive').checked,
            audioThr: document.getElementById('slideAudioThr').value,
            weatherCities: weatherCities
        };
        localStorage.setItem('pixelwachter_v2', JSON.stringify(s));
    }

    function loadSettings() {
        let s = JSON.parse(localStorage.getItem('pixelwachter_v2'));
        if (s) {
            document.getElementById('inpTgToken').value = tgToken = s.tgToken || "";
            document.getElementById('inpTgChatId').value = tgChatId = s.tgChatId || "";
            document.getElementById('selTgVideoMode').value = tgVideoMode = s.tgVideoMode || "full";
            
            document.getElementById('chkAudioActive').checked = s.audioActive || false;
            document.getElementById('slideAudioThr').value = s.audioThr || 50;
            document.getElementById('valAudioThr').innerText = s.audioThr || 50;
            if(s.audioActive) toggleAudioWächter();
            
            weatherCities = s.weatherCities || ["", "", ""];
            document.getElementById('inpCity1').value = weatherCities[0];
            document.getElementById('inpCity2').value = weatherCities[1];
            document.getElementById('inpCity3').value = weatherCities[2];
            updateWeather();
        }
    }
    
    window.onload = () => { loadSettings(); updateWeather(); };

</script>
</body>
</html>
