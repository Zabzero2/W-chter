<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stellwerk-Simulator Pro v3</title>
<style>
    body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .panel { background: #2d2d2d; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 500px; margin-bottom: 30px; }
    .input-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
    label { font-size: 13px; color: #aaa; }
    input[type="text"], select { width: 60%; padding: 8px; background: #444; border: 1px solid #666; color: white; border-radius: 4px; }
    
    .test-area { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .gleis { 
        width: 200px; height: 60px; background: #333; 
        /* Rahmen entfernt */
        display: flex; justify-content: center; align-items: center; 
        font-weight: bold; font-family: 'Courier New', monospace; font-size: 28px;
        text-shadow: 1px 1px 2px black;
    }
</style>
</head>
<body>

<div class="panel">
    <h3>Simulator-Konfiguration</h3>
    <div class="input-group">
        <label>Zugnummer:</label>
        <input type="text" id="zugNr" value="IC 2012" oninput="updateDisplay()">
    </div>
    <div class="input-group">
        <label>Modus:</label>
        <select id="blinkMode" onchange="updateDisplay()">
            <option value="all">Komplette Nummer blinkt</option>
            <option value="last">Nur letzte Ziffer blinkt</option>
        </select>
    </div>
    <div class="input-group">
        <label>Basis-Farbe (Dauerlicht):</label>
        <input type="color" id="baseColor" value="#ffffff" onchange="updateDisplay()">
    </div>
    <div class="input-group">
        <label>Blink-Farbe (Aktiv):</label>
        <input type="color" id="blinkColor" value="#ff0000" onchange="updateDisplay()">
    </div>
    <div class="input-group" style="flex-direction: column; align-items: flex-start;">
        <label>Blink-Frequenz: <span id="freqVal">1000</span>ms</label>
        <input type="range" id="freqSlider" style="width:100%" min="100" max="2000" step="50" value="1000" oninput="restartBlink()">
    </div>
</div>

<div class="test-area">
    <div class="gleis" id="displayBox"></div>
</div>

<script>
    let blinkInterval;
    let isOn = false;

    function restartBlink() {
        const freq = document.getElementById('freqSlider').value;
        document.getElementById('freqVal').innerText = freq;
        clearInterval(blinkInterval);
        blinkInterval = setInterval(toggleBlink, freq);
    }

    function updateDisplay() {
        const text = document.getElementById('zugNr').value;
        const mode = document.getElementById('blinkMode').value;
        const baseCol = document.getElementById('baseColor').value;
        const blinkCol = document.getElementById('blinkColor').value;
        const box = document.getElementById('displayBox');
        
        box.innerHTML = '';
        
        if (mode === 'all') {
            // Komplette Nummer wechselt zwischen Basis und Blinkfarbe
            box.innerText = text;
            box.style.color = isOn ? blinkCol : baseCol;
        } else {
            // Restliche Ziffern leuchten permanent in der Basis-Farbe
            const last = text.slice(-1);
            const rest = text.slice(0, -1);
            
            const spanRest = document.createElement('span');
            spanRest.innerText = rest;
            spanRest.style.color = baseCol; // Dauerhaft Basis-Farbe
            
            const spanLast = document.createElement('span');
            spanLast.innerText = last;
            spanLast.style.color = isOn ? blinkCol : baseCol; // Blinkt
            
            box.appendChild(spanRest);
            box.appendChild(spanLast);
        }
    }

    function toggleBlink() {
        isOn = !isOn;
        updateDisplay();
    }

    // Init
    restartBlink();
    updateDisplay();
</script>
</body>
</html>
